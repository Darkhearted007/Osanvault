<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economic Graph — ÒsánVault</title><style>body{margin:0;background:#06110a;color:#eef6ee;font-family:Inter,system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:32px 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.back{color:#a9c3ae;text-decoration:none}.muted{color:#9db4a2}.panel{background:#0b1910;border:1px solid #203826;border-radius:18px;padding:20px;margin-top:16px}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select,.controls button{padding:11px;border-radius:10px;border:1px solid #29442f;background:#07130b;color:#eef6ee}.controls button{cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.metric{background:#0a170e;border:1px solid #203826;border-radius:12px;padding:14px}.metric b{display:block;font-size:25px;margin-top:6px}.graph{display:grid;grid-template-columns:1fr 2fr;gap:16px}.node{padding:13px;border:1px solid #29442f;border-radius:12px;margin-top:9px}.rel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:13px;border-bottom:1px solid #203826}.tag{font-size:11px;border-radius:999px;padding:5px 8px;background:#15301d;white-space:nowrap}.risk{color:#d8c9a4}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.graph{grid-template-columns:1fr}.rel{grid-template-columns:1fr}.tag{width:max-content}}@media(max-width:500px){.summary{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div><a class="back" href="/">← ÒsánVault</a><h1>Economic Graph Explorer</h1><p class="muted">Inspect evidence-aware relationships between entities, assets, projects and institutions.</p></div></div><section class="panel"><div class="controls"><select id="type"><option value="entity">Economic Entity</option><option value="asset">Asset</option><option value="project">Project</option><option value="institution">Institution</option></select><input id="id" placeholder="Node UUID"><button id="load">Explore graph</button></div><div id="msg" class="muted">Enter a node ID to begin.</div></section><section id="results" style="display:none"><div class="summary"><div class="metric">Relationships<b id="count">0</b></div><div class="metric">Trusted<b id="trusted">0</b></div><div class="metric">Graph score<b id="score">—</b></div><div class="metric">State<b id="state">—</b></div></div><div class="graph"><section class="panel"><h2>Assessment</h2><div id="assessment" class="muted">—</div></section><section class="panel"><h2>Network</h2><div id="rels"></div></section></div></section><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const type=$('#type').value,id=$('#id').value.trim();if(!id){$('#msg').textContent='Enter a node UUID.';return}$('#msg').textContent='Loading…';const r=await fetch('/api/graph?type='+encodeURIComponent(type)+'&id='+encodeURIComponent(id));if(!r.ok){$('#msg').textContent=r.status===401?'Sign in to explore the economic graph.':'Graph request failed.';return}const rows=await r.json();const a=await fetch('/api/graph/assess?type='+encodeURIComponent(type)+'&id='+encodeURIComponent(id));const assessment=a.ok?await a.json():null;$('#results').style.display='block';$('#msg').textContent='';$('#count').textContent=rows.length;$('#trusted').textContent=rows.filter(x=>['verified','trusted'].includes(x.status)).length;$('#score').textContent=assessment?.overallScore??'—';$('#state').textContent=assessment?.state??'—';$('#assessment').innerHTML=assessment?`<p>${esc(assessment.summary)}</p><p><b>Strengths</b><br>${(assessment.strengths||[]).map(esc).join('<br>')||'None identified'}</p><p><b>Risks</b><br>${(assessment.risks||[]).map(esc).join('<br>')||'None identified'}</p><p><b>Opportunities</b><br>${(assessment.opportunities||[]).map(esc).join('<br>')||'None identified'}</p><p><b>Next actions</b><br>${(assessment.nextActions||[]).map(esc).join('<br>')||'None identified'}</p>`:'Assessment unavailable';$('#rels').innerHTML=rows.length?rows.map(x=>`<div class="rel"><div><b>${esc(x.fromType)}</b><div class="muted">${esc(x.fromId)}</div></div><div><span class="tag">${esc(x.relationshipType)}</span><br><small class="${x.status==='verified'||x.status==='trusted'?'':'risk'}">${esc(x.status)} · ${x.confidence??'—'}%</small></div><div><b>${esc(x.toType)}</b><div class="muted">${esc(x.toId)}</div></div></div>`).join(''):'<p class="muted">No relationships recorded for this node yet.'}$('#load').disabled=false}$('#load').onclick=load;</script></main></body></html>
