<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Onboarding</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:20px}input,select,button{padding:10px;margin:5px 0;width:100%}button{cursor:pointer}#out{white-space:pre-wrap;background:#f5f5f5;padding:16px}</style></head><body><h1>Organization Onboarding</h1><p>Provision a tenant and its position-specific dashboards.</p><form id=f><input id=n placeholder="Organization name" required><select id=t><option value="COMPANY">Company</option><option value="GOVERNMENT">Government Agency</option><option value="REGULATOR">Regulator</option><option value="INVESTOR">Investor</option><option value="INSTITUTION">Institution</option></select><button>Provision workspace</button></form><h2>Status</h2><div id=out>Loading…</div><script>async function status(){const r=await fetch('/api/organizations/onboarding-status');const d=await r.json();out.textContent=JSON.stringify(d,null,2)}f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/organizations/onboarding',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:n.value,organization_type:t.value})});out.textContent=JSON.stringify(await r.json(),null,2);status()};status()</script></body></html>
