<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access Lifecycle</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1150px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:4px 0;border:1px solid #ccd4dd;border-radius:8px}button{background:#1769aa;color:#fff;cursor:pointer}.muted{color:#667085}.ok{color:#067647}.err{color:#b42318}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #edf0f3}</style></head><body><header class="head"><h1>Enterprise Access Lifecycle</h1><p>Invitations, activation, roles, positions and revocation.</p></header><main class="wrap"><section class="panel"><h2>Create invitation</h2><div class="grid"><input id="org" placeholder="Organization UUID"><input id="member" placeholder="Invitee member ID"><input id="role" value="USER" placeholder="Role"><input id="position" placeholder="Position code"><input id="expires" placeholder="Expiry ISO (optional)"></div><button onclick="createInvite()">Create invitation</button></section><section class="panel"><h2>Manage access</h2><div class="grid"><input id="morg" placeholder="Organization UUID"><input id="mmember" placeholder="Member ID"><input id="mposition" placeholder="Position code"><select id="action"><option>DEACTIVATE_MEMBER</option><option>REACTIVATE_MEMBER</option><option>CHANGE_ROLE</option><option>CHANGE_POSITION</option></select><input id="mrole" value="USER" placeholder="New role"><button onclick="manage()">Apply change</button></div></section><section class="panel"><h2>Result</h2><pre id="out" class="muted">Ready.</pre></section></main><script>async function post(body){const r=await fetch('/api/organizations/access-lifecycle',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});document.getElementById('out').className=r.ok?'ok':'err';document.getElementById('out').textContent=await r.text()}function createInvite(){post({action:'CREATE_INVITATION',organization_id:org.value,invitee_member_id:member.value,role:role.value,position_code:position.value,expires_at:expires.value||undefined})}function manage(){const a=action.value,b={action:a,organization_id:morg.value,member_id:mmember.value};if(a==='CHANGE_ROLE')b.role=mrole.value;if(a==='CHANGE_POSITION')b.position_code=mposition.value;post(b)}</script></body></html>
