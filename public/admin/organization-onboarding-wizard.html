<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Onboarding Wizard</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:26px 32px}.wrap{max-width:900px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:650}input,select{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #ccd4dd;border-radius:8px}button{margin-top:18px;padding:12px 18px;border:0;border-radius:9px;background:#123b5d;color:#fff;cursor:pointer}.muted{color:#667085}.success{background:#ecfdf3;border:1px solid #abefc6;padding:14px;border-radius:10px}.error{background:#fef3f2;border:1px solid #fecdca;padding:14px;border-radius:10px}</style></head><body><header class="head"><h1>Organization Onboarding</h1><p>Create a tenant and provision its role-specific workspace.</p></header><main class="wrap"><section class="panel"><div class="grid"><label>Organization name<input id="name" placeholder="Example Industrial Ltd"></label><label>Slug<input id="slug" placeholder="example-industrial"></label><label>Organization type<select id="type"><option value="COMPANY">Company</option><option value="GOVERNMENT">Government</option><option value="REGULATOR">Regulator</option><option value="INVESTOR">Investor</option><option value="INSTITUTION">Institution</option></select></label><label>Asset IDs<input id="assets" placeholder="Optional, comma-separated"></label><label>Verified GIS layer IDs<input id="layers" placeholder="Optional, comma-separated"></label></div><button onclick="submitForm()">Create & Provision Workspace</button><div id="out"></div></section><section class="panel"><h2>Existing organizations</h2><div id="orgs" class="muted">Loading…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/organizations/onboarding-wizard');if(!r.ok){document.getElementById('orgs').textContent='Administrator access required.';return}const d=await r.json();document.getElementById('orgs').innerHTML=d.organizations.length?d.organizations.map(o=>`<p><strong>${esc(o.name)}</strong> · ${esc(o.organizationType)} · ${esc(o.status)}</p>`).join(''):'<p>No organizations onboarded yet.</p>'}async function submitForm(){const payload={name:document.getElementById('name').value,slug:document.getElementById('slug').value,organizationType:document.getElementById('type').value,assetIds:document.getElementById('assets').value.split(',').map(x=>x.trim()).filter(Boolean),layerIds:document.getElementById('layers').value.split(',').map(x=>x.trim()).filter(Boolean)};const r=await fetch('/api/organizations/onboarding-wizard',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const t=await r.text();document.getElementById('out').innerHTML=r.ok?`<div class="success">Workspace provisioned successfully.<pre>${esc(t)}</pre></div>`:`<div class="error">${esc(t)}</div>`;if(r.ok)load()}load()</script></body></html>
