<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enterprise Identity Provisioning</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}input,select,button{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #ccd4dd;border-radius:8px}button{background:#1769aa;color:#fff;cursor:pointer}.muted{color:#667085}pre{white-space:pre-wrap}</style></head><body><header class="head"><h1>Enterprise Identity Provisioning</h1><p>Create organizations, provision users and assign positions.</p></header><main class="wrap"><section class="panel"><h2>Create organization</h2><div class="grid"><input id="name" placeholder="Organization name"><input id="slug" placeholder="organization-slug"><input id="type" placeholder="Organization type" value="ENTERPRISE"></div><button onclick="createOrg()">Provision organization</button></section><section class="panel"><h2>Provision member</h2><div class="grid"><input id="org" placeholder="Organization UUID"><input id="member" placeholder="Member ID / platform identity"><input id="role" placeholder="Role" value="USER"></div><button onclick="invite()">Provision member</button></section><section class="panel"><h2>Assign position</h2><div class="grid"><input id="porg" placeholder="Organization UUID"><input id="code" placeholder="Position code e.g. CEO"><input id="pname" placeholder="Position name"><input id="dash" placeholder="Dashboard key e.g. executive"></div><button onclick="position()">Assign position & dashboard</button></section><section class="panel"><h2>Result</h2><pre id="out" class="muted">Ready.</pre></section></main><script>async function post(body){const r=await fetch('/api/organizations/identity-provisioning',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});document.getElementById('out').textContent=await r.text()}function createOrg(){post({action:'CREATE_ORGANIZATION',name:name.value,slug:slug.value,organization_type:type.value})}function invite(){post({action:'INVITE_MEMBER',organization_id:org.value,member_id:member.value,role:role.value})}function position(){post({action:'ASSIGN_POSITION',organization_id:porg.value,position_code:code.value,position_name:pname.value,dashboard_key:dash.value})}</script></body></html>
