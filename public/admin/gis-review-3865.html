<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS Evidence Review — Phase 387.3</title><style>body{font-family:system-ui;margin:32px;max-width:1200px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px;text-align:left}button{margin-right:6px}pre{white-space:pre-wrap}</style></head><body><h1>GIS Evidence Review</h1><p>Phase 387.3 — explicit reviewer decisions only.</p><div id="status">Loading…</div><table><thead><tr><th>Issue</th><th>Source</th><th>Target</th><th>Evidence</th><th>Decision</th></tr></thead><tbody id="rows"></tbody></table><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/continental/gis-phase386-5-review-queue');const d=await r.json();document.getElementById('status').textContent=`${d.count} open items`;document.getElementById('rows').innerHTML=d.items.map(x=>`<tr><td>${esc(x.issue_type)}</td><td>${esc(x.evidence?.phase3868_enrichment?.source_name||x.source_feature_id)}</td><td>${esc(x.evidence?.phase3868_enrichment?.target_name||x.target_feature_id)}</td><td><pre>${esc(JSON.stringify(x.evidence?.phase3869||x.evidence?.phase3868_enrichment||{},null,2))}</pre></td><td><button onclick="decide('${x.source_feature_id}','APPROVE')">Approve</button><button onclick="decide('${x.source_feature_id}','REJECT')">Reject</button><button onclick="decide('${x.source_feature_id}','QUARANTINE')">Quarantine</button><button onclick="decide('${x.source_feature_id}','DEFER')">Defer</button></td></tr>`).join('')}async function decide(id,decision){const rationale=prompt('Reviewer rationale (required):');if(!rationale)return;const r=await fetch('/api/continental/gis-phase386-5-review-queue',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source_feature_id:id,reviewer_id:'admin-reviewer',reviewer_decision:decision,rationale})});if(!r.ok){alert(await r.text());return}load()}load();</script></body></html>
