<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Assignment Console</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1250px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{border:1px solid #e4e7ec;border-radius:12px;padding:16px}.muted{color:#667085}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:14px}input,select,button{padding:10px;border:1px solid #ccd4dd;border-radius:8px}button{cursor:pointer;background:#123b5d;color:#fff}.ok{color:#067647}.err{color:#b42318}@media(max-width:700px){.form{grid-template-columns:1fr}}</style></head><body><header class="head"><h1>Organization Assignment Console</h1><p>Manage tenant-scoped assets and verified GIS layers.</p></header><main class="wrap"><section class="panel"><h2>Organizations</h2><div id="orgs" class="grid"></div></section><section class="panel"><h2>Assignments</h2><div class="form"><select id="org"></select><input id="resource" placeholder="Asset ID or Layer UUID"><select id="type"><option value="ASSIGN_ASSET">Assign asset</option><option value="ASSIGN_LAYER">Assign verified GIS layer</option></select><button onclick="assign()">Assign</button></div><p id="result" class="muted"></p></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let d;async function load(){const r=await fetch('/api/organizations/assignment-console');if(!r.ok){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Administrator access required</h2></section></main>';return}d=await r.json();const o=document.getElementById('org');o.innerHTML=d.organizations.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.organization_type)}</option>`).join('');document.getElementById('orgs').innerHTML=d.organizations.length?d.organizations.map(x=>{const a=d.assetAssignments.filter(y=>y.organization_id===x.id).length,l=d.layerEntitlements.filter(y=>y.organization_id===x.id).length,p=d.positions.filter(y=>y.organization_id===x.id).length;return `<div class="card"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.organization_type)} · ${esc(x.status)}</div><p>${p} positions · ${a} assets · ${l} GIS layers</p></div>`}).join(''):'<p class="muted">No organizations onboarded yet.</p>'}async function assign(){const organization_id=document.getElementById('org').value,resource=document.getElementById('resource').value.trim(),action=document.getElementById('type').value;if(!organization_id||!resource)return;const body={organization_id,action};if(action==='ASSIGN_ASSET')body.asset_id=resource;else body.layer_id=resource;const r=await fetch('/api/organizations/assignment-console',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});document.getElementById('result').className=r.ok?'ok':'err';document.getElementById('result').textContent=await r.text();if(r.ok)load()}load()</script></body></html>
