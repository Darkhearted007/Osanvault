<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Assignment Console</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1250px;margin:auto;padding:28px}.panel{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.row{border-top:1px solid #edf0f3;padding:14px 0}select,input,button{padding:10px;border:1px solid #ccd4dd;border-radius:8px}button{cursor:pointer;background:#123b5d;color:#fff}.muted{color:#667085}.ok{color:#067647}.err{color:#b42318}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #edf0f3}</style></head><body><header class="head"><h1>Organization Assignment Console</h1><p>Manage tenant-scoped assets, GIS layers, positions and dashboards.</p></header><main class="wrap"><section class="panel"><h2>Organizations</h2><select id="org"></select><div id="summary"></div></section><section class="panel"><h2>Positions & dashboards</h2><div id="positions"></div></section><section class="panel"><h2>Assignments</h2><div class="grid"><div><h3>Asset</h3><input id="asset" placeholder="Canonical asset ID"><button onclick="assignAsset()">Assign</button></div><div><h3>GIS layer</h3><input id="layer" placeholder="Layer UUID"><button onclick="assignLayer()">Entitle</button></div></div><p id="result" class="muted"></p></section></main><script>let data;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/organizations/assignment-console');if(!r.ok){document.body.innerHTML='<main class="wrap"><section class="panel"><h2>Administrator access required</h2></section></main>';return}data=await r.json();const o=document.getElementById('org');o.innerHTML=data.organizations.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.organization_type)}</option>`).join('');o.onchange=render;render()}function render(){const id=document.getElementById('org').value;const org=data.organizations.find(x=>x.id===id);const ps=data.positions.filter(x=>x.organization_id===id);const as=data.assignments.assets.filter(x=>x.organization_id===id);const ls=data.assignments.layers.filter(x=>x.organization_id===id);const ds=data.assignments.dashboards.filter(x=>x.organization_id===id);document.getElementById('summary').innerHTML=org?`<p class="muted">${esc(org.slug)} · ${esc(org.status)} · ${as.length} assets · ${ls.length} GIS layers · ${ds.length} dashboards</p>`:'';document.getElementById('positions').innerHTML=ps.length?`<table><tr><th>Position</th><th>Dashboard</th><th>Status</th></tr>${ps.map(p=>`<tr><td>${esc(p.position_name)}</td><td>${esc(p.dashboard_key)}</td><td>${esc(p.status)}</td></tr>`).join('')}</table>`:'<p class="muted">No positions provisioned.</p>'}async function post(body){const r=await fetch('/api/organizations/assignment-console',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});document.getElementById('result').className=r.ok?'ok':'err';document.getElementById('result').textContent=await r.text();if(r.ok){const x=await fetch('/api/organizations/assignment-console');if(x.ok){data=await x.json();render()}}}function assignAsset(){const org=document.getElementById('org').value,asset=document.getElementById('asset').value.trim(),p=data.positions.find(x=>x.organization_id===org);if(!org||!asset||!p)return;post({organization_id:org,position_id:p.id,asset_id:asset,action:'ASSIGN_ASSET'})}function assignLayer(){const org=document.getElementById('org').value,layer=document.getElementById('layer').value.trim();if(!org||!layer)return;post({organization_id:org,layer_id:layer,action:'ASSIGN_LAYER'})}load()</script></body></html>
