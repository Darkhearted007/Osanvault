<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Registry — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:1200px;margin:0 auto;padding:40px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.back{color:#b7c8ba;text-decoration:none}.toolbar{display:flex;gap:10px;margin:28px 0}input,button{background:#0b1910;color:#eef6ee;border:1px solid #29442f;border-radius:10px;padding:12px 14px}button{cursor:pointer}.status{color:#9fc7a7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#0b1910;border:1px solid #203826;border-radius:16px;padding:18px}.card a{color:#eef6ee;text-decoration:none}.id{font-size:12px;color:#8db297}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#15301d;font-size:12px;margin-top:8px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:620px){.cards{grid-template-columns:1fr}}</style></head><body><main><header><div><a class="back" href="/">← ÒsánVault</a><h1>Canonical Asset Registry</h1><div class="status" id="status">Loading…</div></div><a class="back" href="/api/health">API health</a></header><div class="toolbar"><input id="q" placeholder="Search assets…"><button id="refresh">Refresh</button></div><section class="cards" id="cards"></section><script>const cards=document.querySelector('#cards'),status=document.querySelector('#status'),q=document.querySelector('#q');let all=[];async function load(){status.textContent='Loading…';try{const r=await fetch('/api/assets');if(!r.ok)throw new Error('HTTP '+r.status);all=await r.json();render();status.textContent=all.length+' assets';}catch(e){status.textContent='Registry unavailable: '+e.message;cards.innerHTML=''}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){const query=q.value.trim().toLowerCase();cards.innerHTML=all.filter(a=>!query||JSON.stringify(a).toLowerCase().includes(query)).map(a=>`<article class="card"><a href="/asset.html?id=${encodeURIComponent(a.id)}"><div class="id">${esc(a.assetIdentifier)}</div><h3>${esc(a.name)}</h3><div>${esc(a.assetTypeName||a.assetTypeId||'Asset')}</div><span class="pill">${esc(a.status)}</span><p>${esc(a.description||'No description yet.')}</p><small>${esc(a.location||'')}</small></a></article>`).join('')||'<p>No assets found.</p>'}q.addEventListener('input',render);document.querySelector('#refresh').onclick=load;load();</script></main></body></html>
