<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Command Center</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f6f8;color:#132238}.top{background:#102a43;color:#fff;padding:26px 32px}.wrap{max-width:1250px;margin:auto;padding:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button{border:1px solid #d7dee7;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.tabs button.active{background:#102a43;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #dfe5ec;border-radius:15px;padding:20px;min-height:110px}.num{font-size:32px;font-weight:800;margin-top:8px}.muted{color:#667085}.notice{padding:14px 16px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;margin-bottom:18px}.small{font-size:13px}</style></head><body><header class="top"><h1 id="title">Organization Command Center</h1><div id="sub">Loading…</div></header><main class="wrap"><div id="tabs" class="tabs"></div><div id="notice"></div><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const q=new URLSearchParams(location.search);const org=q.get('organization_id');let dash=(q.get('dashboard')||'executive').toLowerCase();const roles=['executive','operations','analyst','regulator','investor'];async function load(){const tabs=document.getElementById('tabs');tabs.innerHTML=roles.map(r=>`<button class="${r===dash?'active':''}" onclick="location.search='?organization_id='+encodeURIComponent(org)+'&dashboard='+r">${r[0].toUpperCase()+r.slice(1)}</button>`).join('');const r=await fetch('/api/continental/gis-phase388-role-dashboard?organization_id='+encodeURIComponent(org||'')+'&dashboard='+encodeURIComponent(dash));if(!r.ok){document.getElementById('sub').textContent='Authorized organization workspace required.';return}const d=await r.json();document.getElementById('title').textContent=d.organization.name+' — '+d.dashboard.label;document.getElementById('sub').textContent=d.organization.organization_type+' · '+d.organization.role;document.getElementById('notice').innerHTML='<div class="notice"><strong>GIS certification:</strong> protected and not enabled.</div>';document.getElementById('grid').innerHTML=Object.entries(d.dashboard.modules).map(([k,v])=>`<section class="card"><div class="muted">${esc(v.kpi)}</div><div class="num">${esc(v.value)}</div><div class="muted small">${esc(v.detail)}</div></section>`).join('')}load();</script></body></html>
