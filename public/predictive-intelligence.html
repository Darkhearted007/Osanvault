<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Predictive Intelligence</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:22px 30px}.wrap{max-width:900px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid #ccd4dd;border-radius:8px}button{background:#1769aa;color:#fff;cursor:pointer}.ok{color:#067647}.err{color:#b42318}pre{white-space:pre-wrap}</style></head><body><header class="head"><h1>Predictive Intelligence</h1><p>Trend-based early warning for authorized company dashboards.</p></header><main class="wrap"><section class="card"><div class="grid"><input id="org" placeholder="Organization UUID"><input id="dash" value="operations" placeholder="Dashboard"><input id="metric" value="risk_score" placeholder="Metric"><input id="horizon" type="number" value="7" min="1" max="30"><input id="threshold" type="number" placeholder="Warning threshold"><textarea id="values" placeholder="Historical values, e.g. 42,45,49,55,61"></textarea></div><button onclick="runForecast()">Run forecast</button><pre id="out"></pre></section></main><script>async function runForecast(){const out=document.getElementById('out');const values=valuesEl=document.getElementById('values').value.split(',').map(Number).filter(Number.isFinite);const r=await fetch('/api/organizations/predictive-intelligence',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({organization_id:document.getElementById('org').value,dashboard:document.getElementById('dash').value,metric:document.getElementById('metric').value,horizon:Number(document.getElementById('horizon').value),warning_threshold:document.getElementById('threshold').value===''?undefined:Number(document.getElementById('threshold').value),values})});out.className=r.ok?'ok':'err';out.textContent=await r.text()}</script></body></html>
