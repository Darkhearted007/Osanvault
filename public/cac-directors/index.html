<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault — Director Onboarding</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7f4;color:#172019;margin:0}.wrap{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.badge{display:inline-block;background:#e7efe8;color:#20552c;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.card{background:#fff;border:1px solid #dce4dc;border-radius:16px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin:10px 0 6px}input{width:100%;box-sizing:border-box;border:1px solid #ccd6cc;border-radius:10px;padding:11px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;background:#183d25;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.muted{color:#667067}.status{padding:12px;border-radius:10px;background:#eef4ee;margin-top:12px;word-break:break-word}.error{background:#fff0ee;color:#8a2e24}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #edf0ed}.pill{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:#edf1ed}.token{font-family:monospace;background:#f0f2f0;padding:8px;border-radius:8px;word-break:break-all}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{font-size:13px}.top{display:block}}</style></head><body><main class="wrap"><div class="top"><div><span class="badge">ADMIN • CAC REGISTRATION</span><h1>Director Onboarding</h1><p class="muted">OSANVAULT AFRICA LTD — proposed director consent and particulars.</p></div><strong id="mailState">Email sender: pending verification</strong></div><section class="card"><h2>Add proposed director</h2><div class="grid"><div><label>Full legal name</label><input id="name" value="Ajayi Damilola Martha"></div><div><label>Email</label><input id="email" value="marthadamilolafunmilayo@gmail.com" type="email"></div></div><button id="create" class="btn">Create Secure Invitation</button><div id="createStatus"></div></section><section class="card"><h2>Director pipeline</h2><div id="list">Loading…</div></section></main><script>async function load(){const r=await fetch('/api/cac/directors');if(!r.ok){document.getElementById('list').innerHTML='<div class="status error">Admin access is required. Sign in to the ÒsánVault workspace first.</div>';return}const j=await r.json();document.getElementById('list').innerHTML=j.directors.length?'<table class="table"><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Consent</th><th>ID</th></tr></thead><tbody>'+j.directors.map(d=>`<tr><td>${d.fullName}</td><td>${d.email}</td><td><span class="pill">${d.status}</span></td><td>${d.consentStatus}</td><td>${d.idDocumentStatus}</td></tr>`).join('')+'</tbody></table>':'<p class="muted">No proposed directors created yet.</p>'}document.getElementById('create').onclick=async()=>{const status=document.getElementById('createStatus');status.innerHTML='Creating secure invitation…';const r=await fetch('/api/cac/directors/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:document.getElementById('name').value,email:document.getElementById('email').value})});const j=await r.json();if(!r.ok){status.innerHTML='<div class="status error">'+(j.error||'Unable to create')+'</div>';return}const link=location.origin+'/cac-director-invite?token='+encodeURIComponent(j.inviteToken);status.innerHTML=`<div class="status"><strong>Invitation created.</strong><p>Expires: ${new Date(j.expiresAt).toLocaleString()}</p><p class="token">${link}</p><p class="muted">Keep this token private. Email sending is intentionally not automatic until the Hatchable domain is verified.</p><button class="btn" id="copy">Copy invitation link</button></div>`;document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(link);load()};load();</script></body></html>
