<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Intelligence — ÒsánVault</title><style>body{margin:0;background:#06110a;color:#eef6ee;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:34px 22px}.back{color:#a8bea9;text-decoration:none}.hero,.card{background:#0b1910;border:1px solid #203826;border-radius:18px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#08140c;border-radius:12px;padding:16px}.label{font-size:12px;color:#8eaa94}.score{font-size:28px;margin-top:5px}.state{display:inline-block;background:#17361f;border-radius:999px;padding:7px 10px;margin-top:10px}.note{color:#9fb2a2;line-height:1.6}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/assets.html">← Asset Registry</a><div id="app" class="hero">Loading intelligence…</div></main><script>const id=new URLSearchParams(location.search).get('id'),app=document.querySelector('#app');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){try{const r=await fetch('/api/assets/'+encodeURIComponent(id)+'/intelligence');const x=await r.json();if(!r.ok)throw Error(x.error||'Unable to load');const a=x.asset,s=x.assessment||{};app.innerHTML=`<div><div class="label">${esc(a.assetIdentifier)}</div><h1>${esc(a.name)}</h1><p class="note">${esc(a.assetTypeName)} · ${esc(a.jurisdiction||'Jurisdiction not recorded')}</p><span class="state">${esc(s.intelligenceState||'developing')}</span></div><div class="grid"><div class="metric"><div class="label">Trust</div><div class="score">${s.trustScore??x.evidence.score}%</div></div><div class="metric"><div class="label">Evidence</div><div class="score">${x.evidence.score}%</div></div><div class="metric"><div class="label">Project readiness</div><div class="score">${s.projectReadinessScore??'—'}</div></div><div class="metric"><div class="label">Overall</div><div class="score">${s.overallScore??'—'}</div></div></div><div class="card"><h2>Decision context</h2><p class="note">${s.overallScore>=80?'Strong data foundation for institutional review.':s.overallScore>=60?'Promising foundation; additional diligence may still be required.': 'The asset needs more evidence, verification, valuation or risk data before project formation.'}</p><p class="note">These indicators support decision-making; they do not replace legal, financial or investment due diligence.</p></div>`}catch(e){app.textContent=e.message}}load();</script></body></html>
