<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations Workspace</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#142033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:750}.muted{color:#667085}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;text-align:left;border-bottom:1px solid #edf0f3}</style></head><body><header class="head"><h1 id="title">Operations Workspace</h1><p id="sub">Loading authorized operational data…</p></header><main class="wrap"><div id="cards" class="grid"></div><section class="card" style="margin-top:18px"><h2>Authorized assets</h2><table class="table"><thead><tr><th>Asset ID</th><th>Access</th></tr></thead><tbody id="assets"></tbody></table></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('organization_id');if(!id){document.getElementById('sub').textContent='organization_id is required';return}const r=await fetch('/api/organizations/operations-workspace?organization_id='+encodeURIComponent(id));if(!r.ok){document.getElementById('sub').textContent='Authorized organization workspace required.';return}const d=await r.json();document.getElementById('title').textContent=d.organization.name+' — Operations';document.getElementById('sub').textContent=d.organization.organization_type+' · '+d.organization.role;const o=d.operations;const cards=[['Authorized assets',o.assetCount],['Dashboards',o.dashboards.length],['Recent audit events',o.recentAudit.length],['Tenant isolation',d.tenantIsolation?'ON':'OFF']];document.getElementById('cards').innerHTML=cards.map(x=>`<section class="card"><div class="muted">${esc(x[0])}</div><div class="num">${esc(x[1])}</div></section>`).join('');document.getElementById('assets').innerHTML=o.assets.length?o.assets.map(a=>`<tr><td>${esc(a.asset_id)}</td><td>${esc(a.access_level)}</td></tr>`).join(''):'<tr><td colspan="2" class="muted">No assets assigned.</td></tr>'}load()</script></body></html>
