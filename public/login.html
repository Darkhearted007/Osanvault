<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — ÒsánVault Africa</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee;min-height:100vh;display:grid;place-items:center}.box{width:min(440px,calc(100% - 40px));background:#0b1910;border:1px solid #203826;border-radius:20px;padding:28px;box-sizing:border-box}h1{margin:0 0 8px}.muted{color:#a9bdad;line-height:1.5}input,button{width:100%;box-sizing:border-box;margin-top:12px;padding:13px 14px;border-radius:10px;border:1px solid #29442f;background:#08150c;color:#eef6ee}button{background:#d7e9d8;color:#0b170d;font-weight:800;cursor:pointer}.error{color:#ffb4a8;margin-top:12px}.back{display:inline-block;margin-top:18px;color:#a9bdad;text-decoration:none}</style></head><body><main class="box"><div class="muted">ÒsánVault Africa</div><h1>Sign in</h1><p class="muted">Access your ÒsánVault workspace with a one-time email code.</p><form id="form"><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" hidden><button id="submit">Continue</button></form><div id="msg" class="error"></div><a class="back" href="/">← Back to ÒsánVault</a></main><script>const A=window.hatchable.auth;const f=document.querySelector('#form'),email=document.querySelector('#email'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),msg=document.querySelector('#msg');let step='email',hasPasskey=false;async function init(){const s=await A.getSession();if(s?.user)location.href=new URLSearchParams(location.search).get('next')||'/assets.html'}init();f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const done=await A.signInWithPasskey({email:email.value.trim()});location.href=new URLSearchParams(location.search).get('next')||'/assets.html';return}catch{}}step='code';code.hidden=false;code.required=true;submit.textContent='Sign in';return}const done=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(done.user)location.href=new URLSearchParams(location.search).get('next')||'/assets.html'}catch(err){msg.textContent=err.message||'Unable to sign in. Please try again.'}});</script></body></html>
