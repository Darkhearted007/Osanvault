<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in — ÒsánVault Africa</title><style>
:root{--deep:#07140e;--paper:#fbfaf6;--ink:#102018;--muted:#66736a;--line:#d9ded6;--brass:#a4874b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 18px 60px rgba(7,20,14,.08)}.brand{font-weight:900;letter-spacing:-.02em;color:var(--deep)}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--brass);border-radius:10px;color:var(--brass);margin-right:9px}h1{font:700 34px/1.05 Georgia,serif;margin:28px 0 10px}.sub{color:var(--muted);font-size:15px;margin:0 0 24px}label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input,button{width:100%;height:48px;border-radius:10px;font:inherit}input{padding:0 14px;border:1px solid var(--line);background:#fff}button{margin-top:12px;border:0;background:var(--deep);color:#fff;font-weight:800;cursor:pointer}button.alt{background:transparent;color:var(--muted);border:1px solid var(--line)}button:disabled{opacity:.55}.msg{min-height:22px;color:var(--muted);font-size:13px;margin:14px 0 0}.err{color:#9b3f2d}.passkey{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}[hidden]{display:none!important}</style></head><body><main class="card">
<div class="brand"><span class="mark">Ò</span>ÒsánVault Africa</div><h1 id="title">Sign in</h1><p class="sub" id="sub">Use your email to receive a one-time code. No password needed.</p>
<form id="form"><div id="emailBox"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" autocapitalize="off" required></div><div id="codeBox" hidden><label for="code">Verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*"></div><button id="submit">Continue</button><button id="back" class="alt" type="button" hidden>Use a different email</button></form>
<div id="passkey" class="passkey" hidden><strong>Add a passkey</strong><p class="sub">Next time, use your fingerprint, face, or screen lock instead of an email code.</p><button id="add" type="button">Add passkey</button><button id="skip" class="alt" type="button">Not now</button></div><p id="msg" class="msg" role="status" aria-live="polite"></p>
</main><script>
(()=>{const A=window.hatchable&&window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),emailBox=document.getElementById('emailBox'),codeBox=document.getElementById('codeBox'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg'),passkey=document.getElementById('passkey'),add=document.getElementById('add'),skip=document.getElementById('skip'),title=document.getElementById('title'),sub=document.getElementById('sub');let step='email',hasPasskey=false;
const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/'};const say=(s,e)=>{msg.textContent=s||'';msg.className='msg '+(e?'err':'')};const go=()=>location.replace(next());
if(!A){say('Sign-in is unavailable. Please refresh.',true);submit.disabled=true;return}
A.getSession().then(s=>{if(s&&s.user)go()}).catch(()=>{});
if(A.attachPasskeyAutofill)A.attachPasskeyAutofill(email).then(r=>{if(r&&r.user)go()}).catch(()=>{});
function finish(){if(hasPasskey||localStorage.getItem('osv_passkey_declined')==='1'||!A.supportsPasskeys||!A.supportsPasskeys()){go();return}form.hidden=true;title.textContent="You're signed in";sub.textContent='Your account is ready.';passkey.hidden=false}
form.addEventListener('submit',e=>{e.preventDefault();submit.disabled=true;if(step==='email'){const em=email.value.trim();if(!em){say('Enter your email address.',true);submit.disabled=false;return}A.startLogin({email:em}).then(r=>{hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){return A.signInWithPasskey({email:em}).then(d=>{if(d&&d.user){go();return null}return'code'}).catch(()=>'code')}return'code'}).then(x=>{if(x!=='code')return;step='code';emailBox.hidden=true;codeBox.hidden=false;back.hidden=false;submit.textContent='Sign in';sub.textContent='Enter the 6-digit code sent to '+em+'.';say('Code sent.');code.focus()}).catch(err=>say(err?.status===429?'Too many attempts. Try again shortly.':(err?.message||'Could not send the code.'),true)).finally(()=>submit.disabled=false);return}
A.verifyCode({email:email.value.trim(),code:code.value.trim()}).then(d=>{if(d&&d.user)finish();else say('That code did not work.',true)}).catch(err=>say(err?.message||'That code did not work.',true)).finally(()=>submit.disabled=false)});
back.onclick=()=>{step='email';emailBox.hidden=false;codeBox.hidden=true;back.hidden=true;submit.textContent='Continue';sub.textContent='Use your email to receive a one-time code. No password needed.';say('');email.focus()};
add.onclick=()=>{add.disabled=skip.disabled=true;A.registerPasskey().then(r=>{if(!r)localStorage.setItem('osv_passkey_declined','1');go()}).catch(err=>{add.disabled=skip.disabled=false;say(err?.message||'Could not save the passkey. You can continue.',true)})};skip.onclick=()=>{localStorage.setItem('osv_passkey_declined','1');go()};email.focus()})();
</script></body></html>
