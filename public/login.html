<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — ÒsánVault Africa</title>
<style>:root{--deep:#07140e;--cream:#f4f0e5;--muted:#aab7ae;--line:#294236;--brass:#d1bb7e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--deep);color:#f7f4eb;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px}.shell{width:min(920px,100%);display:grid;grid-template-columns:1.1fr .9fr;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#0b1b12}.intro{padding:48px;background:var(--cream);color:#102018}.mark{width:38px;height:38px;border:1px solid #a4874b;border-radius:11px;display:grid;place-items:center;color:#a4874b;font-weight:900}.intro h1{font:700 clamp(40px,6vw,62px)/1 Georgia,serif;margin:28px 0 14px}.intro p{color:#5d695f;line-height:1.7}.box{padding:48px}.eyebrow{color:var(--brass);font-size:11px;text-transform:uppercase;letter-spacing:.15em;font-weight:900}h2{font:700 32px Georgia,serif;margin:10px 0}.muted{color:var(--muted);line-height:1.6}label{display:block;font-size:13px;font-weight:800;margin-top:24px}input,button{width:100%;margin-top:9px;padding:14px;border-radius:10px;border:1px solid var(--line);background:#07140e;color:#f7f4eb;font:inherit}button{background:#efe8d5;color:#102018;border-color:#efe8d5;font-weight:900;cursor:pointer}.error{min-height:22px;color:#f0a49a;margin-top:12px;font-size:13px}.back{display:inline-block;margin-top:20px;color:var(--muted);text-decoration:none;font-size:13px}@media(max-width:720px){.shell{grid-template-columns:1fr}.intro{padding:32px}.box{padding:32px}}</style></head>
<body><main class="shell"><section class="intro"><div class="mark">Ò</div><h1>Access the platform.</h1><p>Sign in to your authorized ÒsánVault workspace. Account access and organization permissions are handled by the platform's existing authentication layer.</p></section><section class="box"><div class="eyebrow">ÒsánVault Africa</div><h2>Sign in</h2><p class="muted">Use your email to receive a one-time verification code.</p><form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required><label id="codeLabel" for="code" hidden>Verification code</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" hidden><button id="submit">Continue</button></form><div id="msg" class="error" role="alert"></div><a class="back" href="/">← Return to public site</a></section></main>
<script>const A=window.hatchable.auth,f=document.querySelector('#form'),email=document.querySelector('#email'),code=document.querySelector('#code'),codeLabel=document.querySelector('#codeLabel'),submit=document.querySelector('#submit'),msg=document.querySelector('#msg');let step='email',hasPasskey=false;const next=()=>{const n=new URLSearchParams(location.search).get('next');return n&&n.startsWith('/')&&!n.startsWith('//')?n:'/assets.html'};function showPasskeyOffer(){if(document.querySelector('#passkeyOffer')||hasPasskey||!A.supportsPasskeys()||localStorage.getItem('passkey_offer_declined')==='1')return;const box=document.createElement('div');box.id='passkeyOffer';box.innerHTML='<p class="muted">Add a passkey for faster sign-in with your device biometrics or screen lock.</p><button type="button" id="addPasskey">Add passkey</button><button type="button" id="skipPasskey" style="margin-top:8px;background:transparent;color:#f7f4eb">Not now</button><button type="button" id="continueVault" style="margin-top:8px">Continue to ÒsánVault</button>';f.insertAdjacentElement('afterend',box);box.querySelector('#addPasskey').onclick=async()=>{try{const r=await A.registerPasskey({name:'ÒsánVault device'});if(!r)localStorage.setItem('passkey_offer_declined','1')}catch{}box.remove()};box.querySelector('#skipPasskey').onclick=()=>{localStorage.setItem('passkey_offer_declined','1');location.href=next()};box.querySelector('#continueVault').onclick=()=>location.href=next()};(async()=>{try{const s=await A.getSession();if(s?.user)location.href=next()}catch{}})();f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r?.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const done=await A.signInWithPasskey({email:email.value.trim()});if(done?.user){location.href=next();return}}catch{}}step='code';code.hidden=false;codeLabel.hidden=false;code.required=true;submit.textContent='Sign in';return}const done=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(done?.user){showPasskeyOffer()}}catch(err){msg.textContent=err?.message||'Unable to sign in. Please try again.'}});</script></body></html>
