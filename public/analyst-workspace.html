<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence Analyst Workspace</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:750}.muted{color:#667085}.tag{display:inline-block;background:#eef4f8;border-radius:999px;padding:6px 10px;margin:4px;font-size:13px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;text-align:left;border-bottom:1px solid #edf0f3}</style></head><body><header class="head"><h1 id="title">Intelligence Analyst Workspace</h1><p id="sub">Loading authorized intelligence…</p></header><main class="wrap"><div id="cards" class="grid"></div><section class="card" style="margin-top:18px"><h2>Analyst capabilities</h2><div id="caps"></div></section><section class="card" style="margin-top:18px"><h2>Evidence review status</h2><table class="table"><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody id="reviews"></tbody></table></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('organization_id');if(!id){document.getElementById('sub').textContent='organization_id is required';return}const r=await fetch('/api/organizations/analyst-workspace?organization_id='+encodeURIComponent(id));if(!r.ok){document.getElementById('sub').textContent='Authorized analyst workspace required.';return}const d=await r.json();document.getElementById('title').textContent=d.organization.name+' — Intelligence Analyst';document.getElementById('sub').textContent=d.organization.organization_type+' · '+d.organization.role;const a=d.analyst;document.getElementById('cards').innerHTML=[['Authorized assets',a.assetCount],['Dashboards',a.dashboards.length],['Audit events',a.recentAudit.length],['Tenant isolation',d.tenantIsolation?'ON':'OFF']].map(x=>`<section class="card"><div class="muted">${esc(x[0])}</div><div class="num">${esc(x[1])}</div></section>`).join('');document.getElementById('caps').innerHTML=['Evidence Explorer','Intelligence Signals','GIS Asset Analysis','Risk Correlation','Recommendations','Reports'].map(x=>`<span class="tag">${esc(x)}</span>`).join('');document.getElementById('reviews').innerHTML=a.evidence.reviewQueueStatus.length?a.evidence.reviewQueueStatus.map(x=>`<tr><td>${esc(x.status)}</td><td>${esc(x.count)}</td></tr>`).join(''):'<tr><td colspan="2" class="muted">No review records.</td></tr>'}load()</script></body></html>
