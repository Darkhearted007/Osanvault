<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Intelligence Stream</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:22px 30px}.wrap{max-width:1100px;margin:auto;padding:25px}.bar,.event{background:#fff;border:1px solid #dce3ea;border-radius:12px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.muted{color:#667085}.sev{font-size:12px;font-weight:700}.event button{padding:7px 10px;border:0;border-radius:7px;background:#1769aa;color:#fff}.error{color:#b42318}</style></head><body><header class="head"><h1 id="title">Live Intelligence Stream</h1><p id="sub">Waiting for authorized events…</p></header><main class="wrap"><div class="bar"><strong>Cursor:</strong> <span id="cursor">0</span> · <strong>Unread:</strong> <span id="unread">0</span></div><div id="events"></div></main><script>const p=new URLSearchParams(location.search);let cursor=Number(p.get('after')||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function poll(){const q=new URLSearchParams({organization_id:p.get('organization_id')||'',dashboard:p.get('dashboard')||'',after:String(cursor)});const r=await fetch('/api/organizations/event-stream?'+q);const t=await r.text();if(!r.ok){document.getElementById('sub').className='error';document.getElementById('sub').textContent=t;return}const d=JSON.parse(t);document.getElementById('title').textContent=d.organization.name+' — Live Stream';document.getElementById('sub').textContent=d.position+' · '+(d.module||'all modules');document.getElementById('cursor').textContent=d.cursor;document.getElementById('unread').textContent=d.unread;cursor=d.cursor;const box=document.getElementById('events');for(const e of d.events){const el=document.createElement('article');el.className='event';el.innerHTML='<div class="sev">#'+e.seq+' · '+esc(e.severity)+' · '+esc(e.type)+'</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.message)+'</p><small class="muted">'+esc(e.created_at)+'</small> <button data-id="'+esc(e.id)+'">Acknowledge</button>';el.querySelector('button').onclick=async()=>{await fetch('/api/organizations/event-acknowledge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({organization_id:p.get('organization_id'),dashboard:p.get('dashboard'),event_id:e.id})});el.remove()};box.prepend(el)}}poll();setInterval(poll,5000)</script></body></html>
