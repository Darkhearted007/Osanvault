<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault — Start Today's Activity</title><style>body{font-family:system-ui;margin:0;background:#f5f7f4;color:#17211b}.wrap{max-width:760px;margin:auto;padding:24px 18px}.hero,.card{background:#fff;border:1px solid #dce5df;border-radius:20px;padding:24px;margin-bottom:16px}.hero{background:#10231a;color:#fff}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.actions button{padding:18px;border:1px solid #d7e1da;background:#f8fbf9;border-radius:14px;text-align:left;font-weight:750;color:#17211b;cursor:pointer}.actions button:hover{border-color:#1d6b4d}.money{font-size:28px;font-weight:800}.field{margin:12px 0}input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd7d0;border-radius:10px;font:inherit}button.primary{padding:13px 18px;border:0;border-radius:10px;background:#1d6b4d;color:#fff;font-weight:750}.muted{font-size:14px;opacity:.7}.hidden{display:none}.success{background:#e7f2ec;padding:16px;border-radius:12px}</style></head><body><main class="wrap"><section class="hero"><div>ÒSÁNVAULT AFRICA</div><h1>What happened in your business today?</h1><p>One real activity is enough to begin building your economic record.</p></section><section id="choose" class="card"><h2>Choose an activity</h2><div class="actions"><button data-type="sales">💰 Money came in<br><span class="muted">Sale or customer payment</span></button><button data-type="expense">💸 Money went out<br><span class="muted">Business expense</span></button><button data-type="purchases">📦 Bought stock<br><span class="muted">Inventory or supplies</span></button><button data-type="sales">🤝 Received payment<br><span class="muted">Payment for work or service</span></button></div></section><section id="form" class="card hidden"><h2 id="title">Record activity</h2><div class="field"><label>Amount<input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></label></div><div class="field"><label>What was it?<input id="description" placeholder="Optional description"></label></div><button class="primary" id="save">Save today's activity</button><p id="msg" class="muted"></p></section><section id="done" class="card hidden"><div class="success"><div class="money">✓ Activity recorded</div><p>Your economic journey has started. This record begins as <b>reported</b>. You can add evidence later.</p><button class="primary" id="passport">Open Economic Passport</button></div></section></main><script>(()=>{const API=window.__HATCHABLE__?.api||'/api';const profile=new URLSearchParams(location.search).get('profile');let type='sales';const choose=document.getElementById('choose'),form=document.getElementById('form');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.getElementById('title').textContent=type==='sales'?'Record money received':type==='expense'?'Record money spent':'Record stock purchase';choose.classList.add('hidden');form.classList.remove('hidden')});document.getElementById('save').onclick=async()=>{if(!profile){document.getElementById('msg').textContent='No business profile selected.';return}const amount=Number(document.getElementById('amount').value);if(!Number.isFinite(amount)||amount<=0){document.getElementById('msg').textContent='Enter a valid amount.';return}const r=await fetch(API+'/economic/onboarding/'+profile+'/activities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({activityType:type,amount,description:document.getElementById('description').value||null})});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent=d.error||'Could not save activity';return}form.classList.add('hidden');document.getElementById('done').classList.remove('hidden')};document.getElementById('passport').onclick=()=>location.href='/economic-passport.html?profile='+encodeURIComponent(profile)})()</script></body></html>
