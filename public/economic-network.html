<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault — Economic Network</title><style>body{margin:0;font-family:system-ui;background:#f5f7f4;color:#17211b}.wrap{max-width:1050px;margin:auto;padding:24px 18px}.hero,.card{background:#fff;border:1px solid #dce5df;border-radius:18px;padding:22px;margin-bottom:16px}.hero{background:#10231a;color:white}.graph{min-height:420px;position:relative;overflow:hidden;background:radial-gradient(circle,#eef5f0 1px,transparent 1px);background-size:22px 22px}.node{position:absolute;transform:translate(-50%,-50%);min-width:110px;padding:12px;text-align:center;border-radius:14px;background:#fff;border:2px solid #9db5a7;box-shadow:0 5px 18px #0001}.business{left:50%;top:50%;background:#e7f2ec;border-color:#1d6b4d;font-weight:800}.n1{left:20%;top:25%}.n2{left:80%;top:25%}.n3{left:20%;top:75%}.n4{left:80%;top:75%}.edge{margin:8px 0;padding:12px;border:1px solid #e0e7e2;border-radius:12px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef3ef;font-size:12px;margin-left:6px}</style><main class="wrap"><section class="hero"><div>ÒSÁNVAULT AFRICA</div><h1>Economic Network</h1><p>See the recorded relationships surrounding your business.</p></section><section class="card"><div id="graph" class="graph"><div class="node business" id="biz">Business</div><div class="node n1">Supplier</div><div class="node n2">Customer</div><div class="node n3">Market</div><div class="node n4">Institution</div></div></section><section class="card"><h2>Recorded relationships</h2><div id="list">Loading…</div></section></main><script>(async()=>{const id=new URLSearchParams(location.search).get('profile');const API=window.__HATCHABLE__?.api||'/api';if(!id)return;const r=await fetch(API+'/economic/onboarding/'+encodeURIComponent(id)+'/network-graph');const d=await r.json();if(!r.ok){document.getElementById('list').textContent=d.error||'Unable to load network';retu
