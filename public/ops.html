<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault Operations</title><style>body{margin:0;background:#06110a;color:#eef6ee;font:15px system-ui}main{max-width:1100px;margin:auto;padding:32px 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#0b1910;border:1px solid #203826;border-radius:16px;padding:20px}.ok{color:#8bd49a}.bad{color:#ff9d9d}pre{white-space:pre-wrap;color:#b8c9ba}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>ÒsánVault Operations</h1><div class="grid"><section class="card"><h2>System Health</h2><div id="health">Loading…</div></section><section class="card"><h2>Data Integrity</h2><div id="integrity">Loading…</div></section></div><section class="card"><h2>Recent Lifecycle Events</h2><pre id="audit">Loading…</pre></section><script>async function load(){for(const [id,url] of [['health','/api/system/healthz'],['integrity','/api/system/integrity'],['audit','/api/system/audit?limit=30']]){const el=document.querySelector('#'+id);try{const r=await fetch(url);const x=await r.json();if(id==='audit')el.textContent=JSON.stringify(x,null,2);else{el.className=(x.status==='ok'?'ok':'bad');el.textContent=JSON.stringify(x,null,2)}}catch(e){el.textContent='Unavailable'}}}load();</script></main></body></html>
