<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automated Mitigation</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:22px 30px}.wrap{max-width:1000px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd4dd;border-radius:8px}button{background:#1769aa;color:#fff}.muted{color:#667085}.err{color:#b42318}</style></head><body><header class="head"><h1>Automated Mitigation & Decision</h1><p>Turn risk intelligence into ranked mitigation options.</p></header><main class="wrap"><section class="card"><div class="grid"><input id="org" placeholder="Organization UUID"><input id="dash" value="operations" placeholder="Dashboard"><input id="asset" placeholder="Asset ID (optional)"><input id="risk" type="number" placeholder="Risk score"><input id="conf" type="number" placeholder="Confidence"></div><button onclick="generate()">Generate mitigation plan</button><pre id="out"></pre></section></main><script>async function generate(){const r=await fetch('/api/organizations/mitigation-engine',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({organization_id:org.value,dashboard:dash.value,asset_id:asset.value||null,risk_score:Number(risk.value),confidence:Number(conf.value)})});out.className=r.ok?'':'err';out.textContent=await r.text()}</script></body></html>
