<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company Intelligence Dashboard</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.num{font-size:28px;font-weight:750}.muted{color:#667085}.err{color:#b42318}.ok{color:#067647}pre{white-space:pre-wrap;overflow:auto}</style></head><body><header class="head"><h1 id="title">Company Intelligence</h1><p id="sub">Loading authorized dashboard data…</p></header><main class="wrap"><div id="cards" class="grid"></div><section class="card" style="margin-top:18px"><h2>Live data binding</h2><pre id="detail" class="muted">Loading…</pre></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const p=new URLSearchParams(location.search);const q=new URLSearchParams({organization_id:p.get('organization_id')||'',dashboard:p.get('dashboard')||''});const r=await fetch('/api/organizations/dashboard-intelligence?'+q);const t=await r.text();if(!r.ok){document.getElementById('sub').className='err';document.getElementById('sub').textContent=t;return}const d=JSON.parse(t);document.getElementById('title').textContent=d.organization.name+' — '+d.dashboard;document.getElementById('sub').textContent=d.member.role+' · '+d.member.position_code+' · '+d.modules.length+' authorized modules';document.getElementById('cards').innerHTML=Object.entries(d.counts).map(([k,v])=>`<section class="card"><div class="muted">${esc(k)}</div><div class="num">${esc(v)}</div></section>`).join('');document.getElementById('detail').textContent=JSON.stringify({phase:d.phase,dataBinding:d.dataBinding,tenantIsolation:d.tenantIsolation,modules:d.modules},null,2)}load()</script></body></html>
