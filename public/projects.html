<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:1100px;margin:auto;padding:36px 24px}.back{color:#a8bcae;text-decoration:none}.hero{padding:26px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#0b1910;border:1px solid #203826;border-radius:16px;padding:20px}.pill{display:inline-block;background:#15301d;padding:5px 9px;border-radius:999px;font-size:12px}.muted{color:#9eb3a3}.bar{height:8px;background:#15271a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#77a87d}.row{display:flex;justify-content:space-between;margin:8px 0}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/">← ÒsánVault</a><section class="hero"><h1>Project Formation</h1><p class="muted">Verified assets become structured economic opportunities only after evidence, risk, valuation and legal readiness are established.</p></section><section id="cards" class="cards"><p>Loading…</p></section><script>const el=document.querySelector('#cards');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){const r=await fetch('/api/projects');if(!r.ok){el.innerHTML='<p>Project registry unavailable.</p>';return}const ps=await r.json();el.innerHTML=ps.map(p=>`<article class="card"><div class="muted">${esc(p.projectIdentifier)}</div><h2>${esc(p.name)}</h2><span class="pill">${esc(p.status)}</span><p>${esc(p.description||'No description')}</p><a class="back" href="/project.html?id=${encodeURIComponent(p.id)}">Open project →</a></article>`).join('')||'<p>No projects have been formed yet.</p>'}load()</script></main></body></html>
