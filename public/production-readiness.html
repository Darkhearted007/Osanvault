<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Readiness</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:26px 30px}.wrap{max-width:1100px;margin:auto;padding:26px}.hero,.check{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px;margin:12px 0}.score{font-size:46px;font-weight:800}.pass{color:#067647}.blocked{color:#b42318}.meta{color:#667085}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:700;margin-right:8px}.check{display:grid;grid-template-columns:1fr auto;gap:10px}.details{grid-column:1/-1;color:#667085}button{padding:11px 15px;border:0;border-radius:8px;background:#1769aa;color:#fff;cursor:pointer}</style></head><body><header class="head"><h1>Phase 388 Production Readiness</h1><p>Certification gate — not a marketing claim.</p></header><main class="wrap"><section class="hero"><div id="score" class="score">—</div><div id="decision">Checking…</div><p id="action" class="meta"></p><button onclick="load()">Run certification</button></section><div id="checks"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/system/production-readiness-certification');const d=JSON.parse(await r.text());score.textContent=d.score+'%';decision.textContent=d.decision;decision.className=d.decision==='PRODUCTION_READY'?'pass':'blocked';action.textContent=d.nextAction;checks.innerHTML=d.checks.map(c=>`<section class="check"><strong>${esc(c.name)}</strong><span class="pill ${c.status==='PASS'?'pass':'blocked'}">${esc(c.status)}</span><div class="details">${esc(JSON.stringify(c.details))}</div></section>`).join('')}load()</script></body></html>
