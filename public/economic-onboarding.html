<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault — Business Onboarding</title><style>body{font-family:system-ui;margin:0;background:#f5f7f4;color:#17211b}.wrap{max-width:760px;margin:auto;padding:28px 18px}.hero,.card{padding:24px;border-radius:20px;border:1px solid #dce5df;background:#fff}.hero{background:#10231a;color:#fff;margin-bottom:18px}label{display:block;font-weight:650;margin:14px 0}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd7d0;border-radius:10px;margin-top:6px;font:inherit}textarea{min-height:100px}button{padding:13px 18px;border:0;border-radius:10px;background:#1d6b4d;color:#fff;font-weight:700}.muted{font-size:14px;opacity:.72}.profile{padding:14px;margin-top:10px;background:#f6faf7;border-radius:12px}.profile a{color:#1d6b4d;font-weight:700}</style></head><body><main class="wrap"><section class="hero"><div>ÒSÁNVAULT AFRICA</div><h1>Start your Economic Passport</h1><p>Tell us about the real business you already operate. You can begin before formal financing.</p></section><section class="card"><h2>Create your business profile</h2><p class="muted">Your information starts as self-reported. Evidence can be added and verified later.</p><form id="form"><label>Business / enterprise name<input id="displayName" required></label><label>Business type<input id="businessType" placeholder="Market trader, farm, artisan, shop…" required></label><label>Sector<input id="sector" placeholder="Food, agriculture, transport…" required></label><label>Where do you operate?<input id="locality" placeholder="Town, market or community" required></label><label>Operating since<input id="operatingSince" type="date"></label><label>About the business<textarea id="description" placeholder="What do you sell or provide?"></textarea></label><button>Create my Economic Passport</button><p id="msg"></p></form><div id="existing"></div></section></main><script>(()=>{const API=window.__HATCHABLE__?.api||'/api';const msg=document.getElementById('msg');async function load(){const r=await fetch(API+'/economic/onboarding');if(r.status===401){msg.textContent='Please sign in first.';return}if(!r.ok)return;const d=await r.json();if(d.profiles?.length)document.getElementById('existing').innerHTML='<h3>Your businesses</h3>'+d.profiles.map(p=>'<div class="profile"><b>'+p.displayName+'</b><div class="muted">'+p.sector+' · '+p.locality+'</div><a href="/economic-passport.html?profile='+p.id+'">Open Economic Passport</a></div>').join('')}document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='Creating…';const body={displayName:document.getElementById('displayName').value,businessType:document.getElementById('businessType').value,sector:document.getElementById('sector').value,locality:document.getElementById('locality').value,operatingSince:document.getElementById('operatingSince').value||null,description:document.getElementById('description').value||null};const r=await fetch(API+'/economic/onboarding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Could not create profile';return}location.href=d.passportUrl};load()})()</script></body></html>
