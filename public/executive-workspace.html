<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Intelligence Workspace</title><style>body{margin:0;font-family:Inter,system-ui;background:#f5f7fa;color:#152235}.head{background:#102a43;color:#fff;padding:28px 34px}.wrap{max-width:1240px;margin:auto;padding:28px}.kpis,.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px}.num{font-size:32px;font-weight:800;margin-top:8px}.muted{color:#667085}.section{min-height:110px}.notice{margin-bottom:18px;padding:14px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px}</style></head><body><header class="head"><h1 id="title">Executive Intelligence Workspace</h1><p id="sub">Loading authorized organization workspace…</p></header><main class="wrap"><div id="notice"></div><div id="kpis" class="kpis"></div><h2>Executive Command Modules</h2><div id="sections" class="sections"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('organization_id');if(!id){document.getElementById('sub').textContent='Provide an authorized organization_id.';return}const r=await fetch('/api/organizations/executive-workspace?organization_id='+encodeURIComponent(id));if(!r.ok){document.getElementById('sub').textContent='No authorized executive workspace was found.';return}const d=await r.json(),w=d.executiveWorkspace,k=w.kpis;document.getElementById('title').textContent=d.organization.name+' — Executive Intelligence';document.getElementById('sub').textContent=d.organization.organization_type+' · '+d.organization.role;document.getElementById('notice').innerHTML='<div class="notice"><strong>Evidence integrity:</strong> synthetic company data is disabled. Metrics below represent only authorized production records.</div>';const labels={authorizedAssets:'Authorized assets',authorizedLayers:'Authorized GIS layers',configuredDashboards:'Configured dashboards',enabledModules:'Enabled modules'};document.getElementById('kpis').innerHTML=Object.entries(k).map(([x,v])=>`<section class="card"><div class="muted">${esc(labels[x])}</div><div class="num">${esc(v)}</div></section>`).join('');document.getElementById('sections').innerHTML=w.sections.map(s=>`<section class="card section"><h3>${esc(s)}</h3><p class="muted">Live organization-scoped intelligence module.</p></section>`).join('')}load()</script></body></html>
