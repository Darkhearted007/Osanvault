<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Intelligence</title><style>:root{--deep:#07140e;--paper:#fbfaf6;--ink:#102018;--muted:#68746b;--line:#d9ded6;--brass:#a4874b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;line-height:1.55}.head{background:var(--deep);color:#f7f4eb;padding:26px 30px}.head-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:800}.head p{color:#b9c7bd;margin:8px 0 0}.back{border:1px solid #3a5242;border-radius:10px;padding:10px 14px;font-weight:800;color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:40px 25px 70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.num{font-size:30px;font-weight:800}.muted{color:var(--muted)}.err{color:#8a3329}@media(max-width:650px){.head-inner{align-items:flex-start;flex-direction:column}.wrap{padding:28px 16px 55px}}</style></head><body><header class="head"><div class="head-inner"><div><div class="brand">ÒsánVault Africa</div><h1>Asset Intelligence</h1><p>Evidence-led intelligence for real-world assets.</p></div><a class="back" href="/">← Platform</a></div></header><main class="wrap"><div id="grid" class="grid"></div><p id="msg" class="muted"></p></main><script>const p=new URLSearchParams(location.search),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const q=new URLSearchParams({organization_id:p.get('organization_id')||'',dashboard:p.get('dashboard')||''});if(p.get('asset_id'))q.set('asset_id',p.get('asset_id'));const r=await fetch('/api/organizations/asset-intelligence?'+q);const t=await r.text();if(r.status===401||r.status===403){grid.innerHTML='<section class="card"><h2>Authorized access required</h2><p class="muted">Asset intelligence is available inside an authorized workspace. Sign in to continue.</p><a class="back" href="/login.html?next=/asset-intelligence.html">Sign in</a></section>';msg.textContent='';return}if(!r.ok){grid.innerHTML='<section class="card"><h2>Intelligence unavailable</h2><p class="muted">This information is not currently available for public presentation.</p></section>';msg.textContent='';return}const d=JSON.parse(t);if(d.asset){const a=d.asset;grid.innerHTML=[['Risk score',a.risk.score],['Risk status',a.risk.status],['Intelligence confidence',a.intelligence_confidence],['Alerts',a.alerts.length],['Evidence',a.evidence.length],['Signals',a.signals.length],['GIS layers',a.gis_layers.length]].map(x=>`<section class="card"><div class="muted">${esc(x[0])}</div><div class="num">${esc(x[1])}</div></section>`).join('');msg.textContent=a.recommended_action}else{grid.innerHTML=d.assets.map(a=>`<section class="card"><h3>${esc(a.asset.name||a.asset.id)}</h3><div>Risk: <strong>${esc(a.risk.score)}</strong> · ${esc(a.risk.status)}</div><div class="muted">Confidence ${esc(a.intelligence_confidence)}</div></section>`).join('');msg.textContent=d.assetCount+' assets fused for this authorized tenant'} }load()</script></body></html>
