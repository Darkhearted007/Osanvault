<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Intelligence</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 30px}.wrap{max-width:1200px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:750}.muted{color:#667085}.err{color:#b42318}</style></head><body><header class="head"><h1>Asset Intelligence Fusion</h1><p>Unified asset health, risk, alerts, evidence, signals and GIS.</p></header><main class="wrap"><div id="grid" class="grid"></div><p id="msg" class="muted"></p></main><script>const p=new URLSearchParams(location.search),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const q=new URLSearchParams({organization_id:p.get('organization_id')||'',dashboard:p.get('dashboard')||''});if(p.get('asset_id'))q.set('asset_id',p.get('asset_id'));const r=await fetch('/api/organizations/asset-intelligence?'+q);const t=await r.text();if(!r.ok){msg.className='err';msg.textContent=t;return}const d=JSON.parse(t);if(d.asset){const a=d.asset;grid.innerHTML=[['Risk score',a.risk.score],['Risk status',a.risk.status],['Intelligence confidence',a.intelligence_confidence],['Alerts',a.alerts.length],['Evidence',a.evidence.length],['Signals',a.signals.length],['GIS layers',a.gis_layers.length]].map(x=>`<section class="card"><div class="muted">${esc(x[0])}</div><div class="num">${esc(x[1])}</div></section>`).join('');msg.textContent=a.recommended_action}else{grid.innerHTML=d.assets.map(a=>`<section class="card"><h3>${esc(a.asset.name||a.asset.id)}</h3><div>Risk: <strong>${esc(a.risk.score)}</strong> · ${esc(a.risk.status)}</div><div class="muted">Confidence ${esc(a.intelligence_confidence)}</div></section>`).join('');msg.textContent=d.assetCount+' assets fused for this authorized tenant'} }load()</script></body></html>
