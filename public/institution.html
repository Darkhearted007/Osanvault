<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Institutional Gateway — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:720px;margin:auto;padding:40px 24px}.card{background:#0b1910;border:1px solid #203826;border-radius:18px;padding:24px}.back{color:#a9c3ae;text-decoration:none}input,textarea,select,button{width:100%;box-sizing:border-box;margin-top:8px;margin-bottom:14px;padding:12px;border-radius:10px;border:1px solid #29442f;background:#07130b;color:#eef6ee}button{cursor:pointer}label{font-size:13px;color:#a9c3ae}.notice{padding:12px;background:#102217;border-radius:10px;font-size:13px;color:#b9cabb}</style></head><body><main><a class="back" href="/">← ÒsánVault</a><section class="card"><h1>Institutional Gateway</h1><p>Register an institutional profile for structured due diligence and future project engagement.</p><div class="notice">This does not constitute an investment offer, solicitation or acceptance of funds.</div><form id="f"><label>Organization name</label><input name="organizationName" required><label>Organization type</label><select name="organizationType"><option>Bank</option><option>DFI</option><option>Pension</option><option>Family Office</option><option>Impact Investor</option><option>Corporate</option><option>Development Agency</option><option>Strategic Partner</option></select><label>Jurisdiction</label><input name="jurisdiction" placeholder="Nigeria"><label>Website</label><input name="website"><label>Mandate</label><textarea name="mandate" rows="4"></textarea><button>Register institutional profile</button></form><div id="out"></div></section></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/institutions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const x=await r.json();document.querySelector('#out').textContent=r.ok?'Institutional profile created: '+x.organizationName:(x.error||'Unable to register')}</script></body></html>
