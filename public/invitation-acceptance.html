<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accept Organization Invitation</title><style>body{font-family:system-ui;background:#f4f6f8;color:#172033;margin:0}.head{background:#102a43;color:white;padding:24px 32px}.wrap{max-width:650px;margin:35px auto;padding:20px}.card{background:white;border:1px solid #dce3ea;border-radius:14px;padding:24px}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;border:1px solid #ccd4dd;border-radius:8px}button{background:#1769aa;color:#fff;cursor:pointer}.ok{color:#067647}.err{color:#b42318}</style></head><body><header class="head"><h1>Accept Organization Invitation</h1><p>Activate your organization access and position.</p></header><main class="wrap"><section class="card"><input id="token" placeholder="Paste invitation token"><button onclick="accept()">Accept invitation</button><p id="out"></p></section></main><script>async function accept(){const out=document.getElementById('out');const r=await fetch('/api/organizations/invitation-acceptance',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value.trim()})});out.className=r.ok?'ok':'err';out.textContent=await r.text()}</script></body></html>
