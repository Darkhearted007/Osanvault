<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Health Trajectory</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:22px 30px}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd4dd;border-radius:8px}button{background:#1769aa;color:#fff;cursor:pointer}.muted{color:#667085}.warn{color:#b42318}.good{color:#067647}pre{white-space:pre-wrap}</style></head><body><header class="head"><h1>Asset Health Trajectory</h1><p>Predictive health and risk trajectory for authorized company assets.</p></header><main class="wrap"><section class="card"><div class="grid"><input id="org" placeholder="Organization UUID"><input id="dash" value="operations" placeholder="Dashboard"><input id="asset" placeholder="Asset ID"></div><button onclick="load()">Analyze authorized assets</button></section><section class="card"><pre id="out" class="muted">Waiting…</pre></section></main><script>async function load(){const q=new URLSearchParams({organization_id:org.value.trim(),dashboard:dash.value.trim(),...(asset.value.trim()?{asset_id:asset.value.trim()}: {})});const r=await fetch('/api/organizations/asset-health?'+q);const t=await r.text();out.className=r.ok?'good':'warn';out.textContent=t}</script></body></html>
