<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture an Asset — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:760px;margin:auto;padding:36px 22px}.card{background:#0b1910;border:1px solid #203826;border-radius:18px;padding:24px;margin-top:18px}.back{color:#a9c3ae;text-decoration:none}label{display:block;color:#a9c3ae;font-size:13px;margin-top:14px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border-radius:10px;border:1px solid #29442f;background:#07130b;color:#eef6ee}button{cursor:pointer;margin-top:20px}.note{padding:12px;border-radius:10px;background:#102217;color:#b9cabb;margin-top:14px;font-size:13px}.out{margin-top:16px;color:#b9cabb}</style></head><body><main><a class="back" href="/">← ÒsánVault</a><section class="card"><div>OV-7</div><h1>Capture a Potential Asset</h1><p>Submit a land, housing, agricultural, infrastructure, mineral or carbon opportunity for review.</p><div class="note">Capture is not verification. Submitted assets remain unverified until evidence and professional review are completed.</div><form id="f"><label>Asset / opportunity name</label><input name="name" required><label>Asset type</label><select name="assetTypeCode"><option value="LAND">Land</option><option value="HOUSING">Housing</option><option value="AGRICULTURE">Agriculture</option><option value="INFRASTRUCTURE">Infrastructure</option><option value="MINERAL">Mineral</option><option value="CARBON">Carbon</option></select><label>Contributor type</label><select name="contributorType"><option>community</option><option>landholder</option><option>cooperative</option><option>developer</option><option>farmer</option><option>professional</option><option>institution</option></select><label>Description</label><textarea name="description" rows="4"></textarea><label>Jurisdiction</label><input name="jurisdictionCode" placeholder="NG-EK"><label>Location</label><input name="location" placeholder="Ado-Ekiti, Ekiti State"><label>Latitude</label><input name="latitude" type="number" step="any"><label>Longitude</label><input name="longitude" type="number" step="any"><label>Rights-holder name</label><input name="rightsHolderName"><label>Basis of rights</label><input name="rightsBasis" placeholder="Title, family ownership, lease, customary right, etc."><button>Submit for review</button></form><div class="out" id="out"></div></section></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#out');try{const session=await window.hatchable?.auth?.getSession?.();if(!session?.user){location.href='/login.html?next=/capture.html';return}}catch{location.href='/login.html?next=/capture.html';return}const b=Object.fromEntries(new FormData(e.target));for(const k of ['latitude','longitude'])if(b[k]==='')delete b[k];const r=await fetch('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const x=await r.json();document.querySelector('#out').textContent=r.ok?'Submitted: '+x.submissionIdentifier:(x.error||'Submission failed')}</script></body></html>
