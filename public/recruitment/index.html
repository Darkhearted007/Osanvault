<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Recruitment & Onboarding</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202a;margin:0}.wrap{max-width:1250px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{font-size:28px;font-weight:800}.muted{color:#667085;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}.pill{padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}</style></head><body><div class='wrap'><div class='card'><div class='muted'>ÒSÁNVAULT AFRICA LTD</div><h1>Recruitment & Onboarding</h1><p class='muted'>Management pipeline from open position through offer, onboarding and employee conversion.</p></div><div id='metrics' class='grid'></div><div class='card'><h2>Open positions</h2><div style='overflow:auto'><table class='table'><thead><tr><th>Role</th><th>Department</th><th>Type</th><th>Status</th></tr></thead><tbody id='openings'></tbody></table></div></div><div class='card'><h2>Candidate pipeline</h2><div id='pipeline' class='grid'></div></div></div><script>const API=window.__HATCHABLE__.api;async function load(){const x=await fetch(API+'/recruitment/dashboard').then(r=>r.json());const stages=x.candidate_pipeline||[];const offers=x.offers||[];const on=x.onboarding||[];const total=a=>a.reduce((n,v)=>n+Number(v.count||0),0);metrics.innerHTML=[['Candidates',total(stages)],['Offers',total(offers)],['Onboarding cases',total(on)],['Open positions',(x.openings||[]).filter(o=>o.status==='open').length]].map(a=>`<div class='card'><div class='muted'>${a[0]}</div><div class='metric'>${a[1]}</div></div>`).join('');openings.innerHTML=x.openings?.length?x.openings.map(o=>`<tr><td>${o.title}</td><td>${o.department||'—'}</td><td>${o.employment_type}</td><td><span class='pill'>${o.status}</span></td></tr>`).join(''):'<tr><td colspan=4>No positions created yet.</td></tr>';pipeline.innerHTML=stages.length?stages.map(s=>`<div class='card'><div class='muted'>${s.stage}</div><div class='metric'>${s.count}</div></div>`).join(''):'<div class="muted">No candidates yet.</div>'}load().catch(()=>document.body.innerHTML+='<p style="padding:20px">Unable to load recruitment dashboard.</p>');</script></body></html>
