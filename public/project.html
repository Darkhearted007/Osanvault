<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:1100px;margin:auto;padding:32px 24px}.back{color:#a8bcae;text-decoration:none}.panel{background:#0b1910;border:1px solid #203826;border-radius:16px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{background:#09160d;padding:14px;border-radius:12px}.label{font-size:12px;color:#8da995}.value{font-size:18px;margin-top:5px}.bar{height:9px;background:#16271a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#77a87d}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/projects.html">← Projects</a><div id="app" class="panel">Loading…</div></main><script>const id=new URLSearchParams(location.search).get('id'),app=document.querySelector('#app');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function load(){try{const [p,r]=await Promise.all([fetch('/api/projects/'+id).then(x=>x.json()),fetch('/api/projects/'+id+'/readiness').then(x=>x.json())]);app.innerHTML=`<div class="label">${esc(p.projectIdentifier)}</div><h1>${esc(p.name)}</h1><p>${esc(p.description||'No description')}</p><div class="grid"><div class="item"><div class="label">Status</div><div class="value">${esc(p.status)}</div></div><div class="item"><div class="label">Structure</div><div class="value">${esc(p.structureType||'Not structured')}</div></div><div class="item"><div class="label">Capital readiness</div><div class="value">${esc(r.state)}</div></div></div><div class="panel"><div class="label">Readiness</div><div class="value">${r.score}%</div><div class="bar"><i style="width:${r.score}%"></i></div><p class="label">${r.missing.length?('Missing: '+r.missing.join(', ')):'All current gates complete.'}</p></div><div class="panel"><h2>Assets</h2>${p.assets.map(a=>`<p><a class="back" href="/asset.html?id=${encodeURIComponent(a.id)}">${esc(a.assetIdentifier)} — ${esc(a.name)}</a> <span class="label">${esc(a.status)}</span></p>`).join('')||'<p class="label">No assets attached.</p>'}</div><div class="panel"><h2>Milestones</h2>${p.milestones.map(m=>`<p><b>${esc(m.title)}</b> — ${esc(m.status)}</p>`).join('')||'<p class="label">No milestones yet.</p>'}</div>`}catch(e){app.textContent='Project could not be loaded.'}}if(id)load();else app.textContent='Missing project id';</script></body></html>
