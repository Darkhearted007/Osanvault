<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cascading Risk</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 30px}.wrap{max-width:1150px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.big{font-size:30px;font-weight:750}.item{padding:12px 0;border-bottom:1px solid #eef1f4}.muted{color:#667085}.err{color:#b42318}</style></head><body><header class="head"><h1>Cascading Risk & Dependency Analysis</h1><p>Trace how risk propagates through connected intelligence.</p></header><main class="wrap"><section class="card"><div class="grid"><input id="org" placeholder="Organization UUID"><input id="dash" value="operations" placeholder="Dashboard"><input id="root" placeholder="Root entity key, e.g. ASSET:123"><button onclick="run()">Analyze cascade</button></div></section><div id="cards" class="grid" style="margin-top:15px"></div><section class="card" style="margin-top:15px"><h2>Affected entities</h2><div id="items"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){const q=new URLSearchParams({organization_id:org.value,dashboard:dash.value,root:root.value});const r=await fetch('/api/organizations/cascading-risk?'+q),t=await r.text();if(!r.ok){cards.innerHTML='<section class="card err">'+esc(t)+'</section>';return}const d=JSON.parse(t);cards.innerHTML=[['Impact score',d.impactScore],['Affected entities',d.affected.length],['Critical projections',d.criticalCount]].map(x=>`<section class="card"><div class="muted">${esc(x[0])}</div><div class="big">${esc(x[1])}</div></section>`).join('');items.innerHTML=d.affected.map(x=>`<div class="item"><strong>${esc(x.asset?.name||x.key)}</strong><br><span class="muted">${esc(x.relation)} · depth ${esc(x.depth)} · projected risk ${esc(x.projected_risk)} (${esc(x.projected_status)})</span></div>`).join('')||'<p class="muted">No downstream relationships detected.</p>'} </script></body></html>
