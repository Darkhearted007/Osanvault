<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence Workspace</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:26px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:20px}.muted{color:#667085}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#1849a9;font-size:12px;margin:3px}a{display:inline-block;margin-top:12px;padding:10px 14px;background:#1769aa;color:#fff;border-radius:9px;text-decoration:none}</style></head><body><header class="head"><h1>Intelligence Workspace</h1><p id="sub">Determining your authorized organization and position…</p></header><main class="wrap"><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/organizations/workspace-launcher');if(!r.ok){document.getElementById('sub').textContent='Sign in with an authorized organization account.';return}const d=await r.json();document.getElementById('sub').textContent=d.launches.length?`${d.launches.length} authorized organization workspace(s)`:'No organization workspace is assigned to this account.';document.getElementById('grid').innerHTML=d.launches.length?d.launches.map(x=>`<section class="card"><h2>${esc(x.organization.name)}</h2><p class="muted">${esc(x.organization.organization_type)} · ${esc(x.organization.role)}</p>${x.routing.length?x.routing.map(y=>`<span class="pill">${esc(y.position)} → ${esc(y.dashboard)}</span>`).join(''):'<p class="muted">No positions assigned.</p>'}${x.routing.length?`<br><a href="${x.routing[0].url}">Open authorized workspace</a>`:''}</section>`).join(''):'<section class="card"><h2>No workspace assigned</h2><p class="muted">An administrator must provision an organization and position before a dashboard can be launched.</p></section>'}load()</script></body></html>
