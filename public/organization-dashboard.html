<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Intelligence Dashboard</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#142033}.head{background:#102a43;color:#fff;padding:26px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border:1px solid #dfe5eb;border-radius:14px;padding:20px}.num{font-size:32px;font-weight:750}.muted{color:#667085}.warn{background:#fff7ed;border:1px solid #fed7aa;padding:14px;border-radius:12px;margin-bottom:20px}</style></head><body><header class="head"><h1 id="title">Organization Intelligence</h1><p id="sub">Loading authorized workspace…</p></header><main class="wrap"><div id="warn"></div><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const qs=new URLSearchParams(location.search);async function load(){const org=qs.get('organization_id'),dash=qs.get('dashboard')||'executive';const url='/api/organizations/dashboard-live?organization_id='+encodeURIComponent(org||'')+'&dashboard='+encodeURIComponent(dash);const r=await fetch(url);if(!r.ok){document.getElementById('sub').textContent='Authorized organization workspace required.';return}const d=await r.json();document.getElementById('title').textContent=d.organization.name+' — '+dash;document.getElementById('sub').textContent=d.organization.organization_type+' · '+d.organization.role;const m=d.dashboard.metrics;document.getElementById('warn').innerHTML=m.activeReviewExceptions?`<div class="warn"><strong>Certification remains blocked.</strong> ${m.activeReviewExceptions} GIS review exceptions remain in the platform-wide certification gate.</div>`:'';const labels={authorizedAssets:'Authorized assets',positionCount:'Positions',authorizedGisFeatures:'Authorized GIS features',publishedIntelligenceLayers:'Published intelligence layers',activeReviewExceptions:'Open GIS exceptions',decisionFlags:'Decision flags'};document.getElementById('grid').innerHTML=Object.entries(m).map(([k,v])=>`<section class="card"><div class="muted">${esc(labels[k]||k)}</div><div class="num">${esc(v)}</div></section>`).join('')}load()</script></body></html>
