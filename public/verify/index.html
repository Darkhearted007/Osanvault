<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault — Certification Verification</title><style>:root{--deep:#07140e;--paper:#fbfaf6;--ink:#102018;--muted:#68746b;--line:#d9ded6;--brass:#a4874b}*{box-sizing:border-box}body{font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;margin:0;background:var(--paper);color:var(--ink)}main{max-width:900px;margin:40px auto;padding:30px;background:#fff;border:1px solid var(--line);border-radius:18px}.brand{font-weight:800}.back{color:var(--muted);text-decoration:none}.hero{padding:35px 0 20px}.hero h1{font:700 46px/1.05 Georgia,serif;margin:10px 0}.hero p{color:var(--muted);line-height:1.7}.field{display:flex;gap:10px;flex-wrap:wrap}.field input{flex:1;min-width:240px}input,button{padding:12px;border-radius:9px;border:1px solid var(--line);font-size:15px}button{cursor:pointer;background:var(--deep);color:#fff;font-weight:800}pre{display:none}.ok,.bad{margin-top:20px;padding:16px;border-radius:10px}.ok{background:#edf7ef}.bad{background:#f4f0e5}@media(max-width:600px){main{margin:18px 14px;padding:22px}.hero h1{font-size:38px}.field input,.field button{width:100%}}</style></head><body><main><h1>Certification Verification</h1><p>Verify an ÒsánVault authoritative geographic feature against its public certification record and audit-chain integrity.</p><input id="feature" placeholder="Feature ID"><button onclick="verify()">Verify</button><div id="result"></div></main><script>async function verify(){const id=document.getElementById('feature').value.trim();if(!id)return;const r=await fetch('/api/continental/gis-phase363-verify?feature_id='+encodeURIComponent(id));const d=await r.json();const ok=r.ok&&d.integrity?.chainValid&&d.verification?.status==='CERTIFIED';document.getElementById('result').innerHTML='<div class="'+(ok?'ok':'bad')+'"><b>'+ (ok?'CERTIFIED & CHAIN VALID':'VERIFICATION REQUIRES REVIEW')+'</b></div><pre>'+JSON.stringify(d,null,2)+'</pre>';}</script></body></html>
