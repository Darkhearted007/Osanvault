<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault — Certification Verification</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:40px auto;padding:20px;background:#f6f7f9;color:#17202a}main{background:white;border:1px solid #ddd;border-radius:16px;padding:28px}input,button{padding:12px;border-radius:9px;border:1px solid #bbb;font-size:15px}input{width:65%}button{cursor:pointer;background:#111;color:#fff}pre{white-space:pre-wrap;background:#f1f3f5;padding:16px;border-radius:10px;margin-top:20px}.ok{padding:12px;border-radius:8px;background:#e9f7ef}.bad{padding:12px;border-radius:8px;background:#fdecec}</style></head><body><main><h1>Certification Verification</h1><p>Verify an ÒsánVault authoritative geographic feature against its public certification record and audit-chain integrity.</p><input id="feature" placeholder="Feature ID"><button onclick="verify()">Verify</button><div id="result"></div></main><script>async function verify(){const id=document.getElementById('feature').value.trim();if(!id)return;const r=await fetch('/api/continental/gis-phase363-verify?feature_id='+encodeURIComponent(id));const d=await r.json();const ok=r.ok&&d.integrity?.chainValid&&d.verification?.status==='CERTIFIED';document.getElementById('result').innerHTML='<div class="'+(ok?'ok':'bad')+'"><b>'+ (ok?'CERTIFIED & CHAIN VALID':'VERIFICATION REQUIRES REVIEW')+'</b></div><pre>'+JSON.stringify(d,null,2)+'</pre>';}</script></body></html>
