<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ÒsánVault Trust Registry</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:980px;margin:40px auto;padding:20px;background:#f6f7f9;color:#17202a}main{background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px}form{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:12px;border-radius:9px;border:1px solid #bbb;font-size:15px}input{flex:1;min-width:220px}button{cursor:pointer;background:#111;color:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:16px;border-radius:10px;margin-top:20px}.badge{display:inline-block;padding:7px 10px;border-radius:8px;background:#e9f7ef;font-weight:700}</style>
</head><body><main><h1>ÒsánVault Trust Registry</h1><p>Read-only public verification for geographic certification records. Confidential evidence and internal hashes are not exposed.</p>
<form id="lookupForm"><input id="id" maxlength="200" placeholder="Registry ID (OSV-…) or Feature ID" required><button type="submit">Verify</button></form>
<p id="status" role="status" aria-live="polite"></p><pre id="out" hidden></pre></main>
<script>
const form=document.getElementById('lookupForm'),input=document.getElementById('id'),status=document.getElementById('status'),out=document.getElementById('out');
form.addEventListener('submit',async event=>{event.preventDefault();const value=input.value.trim();status.textContent='Checking registry…';out.hidden=true;out.textContent='';if(!value){status.textContent='Enter a registry ID or feature ID.';return}try{const response=await fetch('/api/public/geographic-certification?id='+encodeURIComponent(value),{headers:{Accept:'application/json'}});const data=await response.json().catch(()=>({}));status.textContent=response.ok?(data.verified?'CERTIFIED — chain integrity passed':'REQUIRES REVIEW — certification not verified'):(data.error||'Public registry record not found');out.hidden=false;out.textContent=JSON.stringify(data,null,2);}catch{status.textContent='Registry lookup is temporarily unavailable.';}});
</script></body></html>
