<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault Trust Registry</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:980px;margin:40px auto;padding:20px;background:#f6f7f9;color:#17202a}main{background:#fff;border:1px solid #ddd;border-radius:16px;padding:28px}input,button{padding:12px;border-radius:9px;border:1px solid #bbb;font-size:15px}input{width:65%}button{cursor:pointer;background:#111;color:#fff}pre{white-space:pre-wrap;background:#f1f3f5;padding:16px;border-radius:10px;margin-top:20px}.badge{display:inline-block;padding:7px 10px;border-radius:8px;background:#e9f7ef;font-weight:700}</style></head><body><main><h1>ÒsánVault Trust Registry</h1><p>Read-only registry for verified geographic certifications.</p><input id="id" placeholder="Registry ID or Feature ID"><button onclick="lookup()">Verify</button><div id="out"></div></main><script>async function lookup(){const v=document.getElementById('id').value.trim();if(!v)return;const key=v.startsWith('OSV-')?'registry_id':'feature_id';const r=await fetch('/api/continental/gis-phase366-trust?'+key+'='+encodeURIComponent(v));const d=await r.json();document.getElementById('out').innerHTML='<p class="badge">'+(r.ok?'READ-ONLY TRUST RECORD':'NOT FOUND')+'</p><pre>'+JSON.stringify(d,null,2)+'</pre>';}</script></body></html>
