<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Workspace</title><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#172033}.top{padding:24px 32px;background:#10243e;color:white}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border:1px solid #dce2ea;border-radius:14px;padding:20px}.muted{color:#667085}a{display:inline-block;margin-top:12px;padding:10px 14px;background:#1769aa;color:white;border-radius:9px;text-decoration:none}</style></head><body><header class="top"><h1 id="org">Organization Workspace</h1><p id="sub">Loading authorized workspaces…</p></header><main class="wrap"><div id="grid" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/continental/gis-phase388-workspace');if(!r.ok){document.getElementById('sub').textContent='Sign in with an authorized organization account.';return}const d=await r.json();const all=d.organizations.flatMap(o=>o.positions.map(p=>({org:o.organization,p})));document.getElementById('sub').textContent=`${d.organizations.length} authorized organization(s)`;document.getElementById('grid').innerHTML=all.length?all.map(x=>`<section class="card"><h2>${esc(x.org.name)}</h2><div class="muted">${esc(x.org.organization_type)}</div><h3>${esc(x.p.title)}</h3><a href="${x.p.workspace_url}">Open ${esc(x.p.dashboard_key)}</a></section>`).join(''):'<section class="card"><h2>No workspace assigned</h2><p class="muted">Ask a platform administrator to assign your organization and position.</p></section>'}load()</script></body></html>
