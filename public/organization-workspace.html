<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organization Workspace</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.muted{color:#667085}.err{background:#fef3f2;border:1px solid #fecdca;color:#b42318;padding:16px;border-radius:12px}.ok{background:#ecfdf3;border:1px solid #abefc6;color:#067647;padding:16px;border-radius:12px}</style></head><body><header class="head"><h1 id="title">Organization Workspace</h1><p id="sub">Authorizing workspace…</p></header><main class="wrap"><div id="status"></div><div id="grid" class="grid" style="margin-top:18px"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const q=new URLSearchParams(location.search),id=q.get('organization_id'),dash=q.get('dashboard');if(!id||!dash){document.getElementById('status').innerHTML='<div class="err">Organization and dashboard are required.</div>';return}const r=await fetch('/api/organizations/authorize-workspace?organization_id='+encodeURIComponent(id)+'&dashboard='+encodeURIComponent(dash));const text=await r.text();if(!r.ok){document.getElementById('status').innerHTML='<div class="err"><strong>Access denied.</strong><br>'+esc(text)+'</div>';return}const d=JSON.parse(text);document.getElementById('title').textContent=d.organization.name+' — '+d.dashboard;document.getElementById('sub').textContent=d.position.position_name+' · '+d.member.role;document.getElementById('status').innerHTML='<div class="ok"><strong>Authorized.</strong> Tenant and position checks passed.</div>';document.getElementById('grid').innerHTML=d.modules.map(m=>`<section class="card"><h3>${esc(m.replaceAll('_',' '))}</h3><p class="muted">Authorized module</p></section>`).join('')}load()</script></body></html>
