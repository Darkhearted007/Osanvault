<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Regulator Oversight</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#26384a;color:#fff;padding:24px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:750}.muted{color:#667085}.warn{margin-top:18px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:15px}</style></head><body><header class="head"><h1 id="title">Regulator Oversight</h1><p id="sub">Loading authorized regulatory workspace…</p></header><main class="wrap"><div id="cards" class="grid"></div><div id="warn"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('organization_id');if(!id)return;const r=await fetch('/api/organizations/regulator-workspace?organization_id='+encodeURIComponent(id));if(!r.ok){document.getElementById('sub').textContent='Authorized regulator workspace required.';return}const d=await r.json(),x=d.regulatory;document.getElementById('title').textContent=d.organization.name+' — Regulatory Oversight';document.getElementById('sub').textContent=d.organization.organization_type+' · '+d.organization.role;const cards=[['Authorized assets',x.authorizedAssets.length],['Authorized GIS layers',x.authorizedLayers.length],['Open review items',x.openReviewItems],['Audit events',x.recentAudit.length]];document.getElementById('cards').innerHTML=cards.map(c=>`<section class="card"><div class="muted">${esc(c[0])}</div><div class="num">${esc(c[1])}</div></section>`).join('');document.getElementById('warn').innerHTML='<div class="warn"><strong>Certification gate:</strong> GIS certification remains independently disabled until outstanding evidence exceptions are resolved.</div>'}load()</script></body></html>
