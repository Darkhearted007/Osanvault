<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault Africa — Customer Success</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f6f7f9;color:#17202a}.wrap{max-width:1200px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#667085;text-transform:uppercase}h1{margin:6px 0}.pill{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#ecfdf3;color:#067647}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.metric{font-size:30px;font-weight:800;margin-top:7px}.small{font-size:13px;color:#667085}.section{margin-top:22px}.list{list-style:none;padding:0;margin:10px 0}.list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.notice{margin-top:22px;padding:16px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa}.error{color:#b42318}</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">ÒsánVault Africa</div><h1>Customer Success Command Center</h1><div class="small">Lifecycle, activation and customer health</div></div><span id="status" class="pill">Loading…</span></div><div id="metrics" class="grid"></div><div class="grid section"><div class="card"><b>Lifecycle</b><ul id="lifecycle" class="list"></ul></div><div class="card"><b>Milestones</b><ul id="milestones" class="list"></ul></div></div><div class="notice"><b>Commercial controls:</b> Payment collection <strong>DISABLED</strong> · Regulated features <strong>LOCKED</strong><div class="small" style="margin-top:7px">Customer-success analytics do not constitute financial-service approval.</div></div><p id="error" class="error"></p></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const li=(id,a,k,v)=>document.getElementById(id).innerHTML=a.length?a.map(x=>`<li><span>${esc(x[k])}</span><b>${esc(x[v])}</b></li>`).join(''):'<li class="small">No customer data yet</li>';fetch('/api/system/customer-success').then(r=>{if(!r.ok)throw new Error('Admin access required');return r.json()}).then(d=>{document.getElementById('status').textContent='LIVE';const total=d.lifecycle.reduce((n,x)=>n+Number(x.customers),0),health=d.lifecycle.length?Math.round(d.lifecycle.reduce((n,x)=>n+Number(x.avg_health)*Number(x.customers),0)/Math.max(total,1)):0,activation=d.lifecycle.length?Math.round(d.lifecycle.reduce((n,x)=>n+Number(x.avg_activation)*Number(x.customers),0)/Math.max(total,1)):0;document.getElementById('metrics').innerHTML=[['Customers',total],['Avg health',health],['Avg activation',activation+'%'],['Lifecycle stages',d.lifecycle.length]].map(x=>`<div class="card"><div class="small">${esc(x[0])}</div><div class="metric">${esc(x[1])}</div></div>`).join('');li('lifecycle',d.lifecycle,'lifecycle_stage','customers');li('milestones',d.milestones,'milestone_key','completed')}).catch(e=>{document.getElementById('status').textContent='PROTECTED';document.getElementById('error').textContent=e.message})</script></body></html>
