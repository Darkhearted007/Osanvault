<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>HR Operations</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202a;margin:0}.wrap{max-width:1250px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:30px;font-weight:800}.muted{color:#667085;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}</style></head><body><div class='wrap'><div class='card'><div class='muted'>ÒSÁNVAULT AFRICA LTD</div><h1>HR Operations & Workforce Intelligence</h1><p class='muted'>Management view for workforce status, employee requests, alerts and performance cycles.</p></div><div id='metrics' class='grid'></div><div class='card'><h2>Pending employee requests</h2><div id='requests'>Loading…</div></div><div class='card'><h2>Workforce alerts</h2><div style='overflow:auto'><table class='table'><thead><tr><th>Severity</th><th>Type</th><th>Title</th><th>Due</th><th>Details</th></tr></thead><tbody id='alerts'></tbody></table></div></div><div class='card'><h2>Performance cycles</h2><div id='cycles'>Loading…</div></div></div><script>const API=window.__HATCHABLE__.api;async function load(){const x=await fetch(API+'/people/hr-operations').then(r=>r.json());const w=x.workforce||{};metrics.innerHTML=[['Employees',w.employees],['Active',w.active],['Onboarding',w.onboarding],['Inactive',w.inactive]].map(a=>`<div class='card'><div class='muted'>${a[0]}</div><div class='metric'>${a[1]||0}</div></div>`).join('');requests.innerHTML=x.pendingRequests?.length?x.pendingRequests.map(r=>`<p><b>${r.type}</b> — ${r.count} pending</p>`).join(''):'<span class="muted">No pending requests.</span>';alerts.innerHTML=x.alerts?.length?x.alerts.map(a=>`<tr><td><span class='pill'>${a.severity}</span></td><td>${a.alert_type}</td><td>${a.title}</td><td>${a.due_date||'—'}</td><td>${a.details||''}</td></tr>`).join(''):'<tr><td colspan=5>No open alerts.</td></tr>';cycles.innerHTML=x.performanceCycles?.length?x.performanceCycles.map(c=>`<p><b>${c.name}</b> · ${c.start_date} → ${c.end_date} · due ${c.due_date||'—'} · <span class='pill'>${c.status}</span></p>`).join(''):'<span class="muted">No performance cycles created yet.</span>'}load().catch(()=>document.body.innerHTML+='<p style="padding:20px">Unable to load HR operations.</p>');</script></body></html>
