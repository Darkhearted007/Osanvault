<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence Event Generator</title><style>body{font-family:system-ui;background:#f4f6f8;color:#172033;margin:0}.head{background:#102a43;color:#fff;padding:22px 30px}.wrap{max-width:760px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:22px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border:1px solid #ccd4dd;border-radius:8px}button{background:#1769aa;color:#fff;cursor:pointer}.ok{color:#067647}.err{color:#b42318}</style></head><body><header class="head"><h1>Intelligence Event Generator</h1><p>Publish a tenant-scoped event into the live intelligence stream.</p></header><main class="wrap"><section class="card"><input id="org" placeholder="Organization UUID"><select id="type"><option>ASSET</option><option>ASSET_STATUS</option><option>ALERT</option><option>RISK</option><option>EVIDENCE</option><option>SIGNAL</option><option>GIS</option><option>OPPORTUNITY</option><option>REPORT</option><option>ACTION</option><option>COMPLIANCE</option><option>SYSTEM</option></select><input id="module" placeholder="Module (optional)"><select id="severity"><option>INFO</option><option>LOW</option><option>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select><input id="title" placeholder="Event title"><textarea id="message" placeholder="Event message"></textarea><button onclick="publish()">Generate intelligence event</button><pre id="out"></pre></section></main><script>async function publish(){const out=document.getElementById('out');const body={organization_id:org.value.trim(),type:type.value,module:module.value.trim()||undefined,severity:severity.value,title:title.value.trim(),message:message.value.trim()};const r=await fetch('/api/organizations/intelligence-ingest',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});out.className=r.ok?'ok':'err';out.textContent=await r.text()}</script></body></html>
