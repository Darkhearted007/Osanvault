<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence Relationship Graph</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 30px}.wrap{max-width:1200px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.big{font-size:32px;font-weight:750}.edge{padding:9px 0;border-bottom:1px solid #eef1f4}.muted{color:#667085}.err{color:#b42318}</style></head><body><header class="head"><h1>Intelligence Relationship Graph</h1><p>Connected assets, risks, evidence, alerts, GIS and opportunities.</p></header><main class="wrap"><div id="cards" class="grid"></div><section class="card" style="margin-top:18px"><h2>Relationships</h2><div id="edges"></div></section></main><script>const p=new URLSearchParams(location.search),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const q=new URLSearchParams({organization_id:p.get('organization_id')||'',dashboard:p.get('dashboard')||''});const r=await fetch('/api/organizations/intelligence-graph?'+q),t=await r.text();if(!r.ok){cards.innerHTML='<section class="card err">'+esc(t)+'</section>';return}const d=JSON.parse(t),map=new Map(d.nodes.map(n=>[n.key,n.label]));cards.innerHTML=[['Entities',d.nodes.length],['Relationships',d.edges.length]].map(x=>`<section class="card"><div class="muted">${esc(x[0])}</div><div class="big">${esc(x[1])}</div></section>`).join('');edges.innerHTML=d.edges.slice(0,100).map(e=>`<div class="edge"><strong>${esc(map.get(e[0])||e[0])}</strong> <span class="muted">— ${esc(e[2])} →</span> <strong>${esc(map.get(e[1])||e[1])}</strong></div>`).join('')||'<p class="muted">No relationships yet.</p>'}load()</script></body></html>
