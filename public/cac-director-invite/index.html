<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÒsánVault — Director Invitation</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f7f4;color:#172019;margin:0}.wrap{max-width:760px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #dce4dc;border-radius:16px;padding:22px;margin-top:18px}.badge{display:inline-block;background:#e7efe8;color:#20552c;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}label{display:block;font-weight:700;margin:14px 0 6px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #ccd6cc;border-radius:10px;padding:11px;font:inherit}textarea{min-height:80px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.scope li{margin:8px 0}.btn{border:0;border-radius:10px;padding:12px 17px;background:#183d25;color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.status{padding:12px;border-radius:10px;background:#eef4ee;margin-top:12px}.error{background:#fff0ee;color:#8a2e24}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}h1{margin-bottom:8px}.muted{color:#667067}</style></head><body><main class="wrap"><span class="badge">PRIVATE COMPANY • DIRECTOR ONBOARDING</span><h1>Proposed Appointment as Director</h1><p class="muted">OSANVAULT AFRICA LTD</p><section id="app" class="card"><p>Loading your invitation…</p></section></main><script>(async()=>{const q=new URLSearchParams(location.search),token=q.get('token'),app=document.getElementById('app');if(!token){app.innerHTML='<div class="status error">Invalid invitation link.</div>';return}const get=await fetch('/api/cac/directors/invite?token='+encodeURIComponent(token));const data=await get.json();if(!get.ok){app.innerHTML='<div class="status error">'+(data.error||'Invitation unavailable')+'</div>';return}const d=data.director;app.innerHTML=`<h2>Dear ${d.fullName}</h2><p>You are being invited to serve as a <strong>${d.roleTitle}</strong> of OSANVAULT AFRICA LTD. This is a proposed appointment and requires your consent before the company files the relevant particulars with CAC.</p><h3>Proposed scope</h3><ul class="scope"><li>Participate in corporate governance and strategic decisions.</li><li>Participate in Board discussions and resolutions.</li><li>Support corporate compliance and review of important company documents.</li><li>Support responsible growth of the company's technology and real-world asset intelligence activities.</li><li>Act in the best interests of OSANVAULT AFRICA LTD and comply with applicable obligations.</li></ul><h3>Director particulars</h3><div class="grid"><div><label>Date of birth</label><input id="dob" type="date" value="${d.dateOfBirth||''}"></div><div><label>Nationality</label><input id="nationality" value="${d.nationality||''}"></div><div><label>Occupation</label><input id="occupation" value="${d.occupation||''}"></div><div><label>Phone</label><input id="phone" value="${d.phone||''}"></div></div><label>Residential address</label><textarea id="residential">${d.residentialAddress||''}</textarea><label>Service address</label><textarea id="service">${d.serviceAddress||''}</textarea><label style="display:flex;gap:8px;align-items:flex-start;font-weight:500"><input id="confirm" type="checkbox" style="width:auto;margin-top:4px"> I confirm that the information I provide is accurate and that I agree to serve as a Director of OSANVAULT AFRICA LTD, subject to completion of the company's CAC registration requirements.</label><button id="accept" class="btn" disabled>Accept Appointment &amp; Submit</button><div id="status"></div><hr style="border:0;border-top:1px solid #e6ebe6;margin:24px 0"><h3>Identity document</h3><p class="muted">Upload a genuine recognised photo ID. PDF, JPG or PNG; maximum 8MB.</p><input id="doc" type="file" accept="application/pdf,image/jpeg,image/png"><button id="upload" class="btn" style="margin-top:12px">Upload ID</button><div id="uploadStatus"></div>`;const status=document.getElementById('status');const accept=document.getElementById('accept');document.getElementById('confirm').onchange=e=>accept.disabled=!e.target.checked;accept.onclick=async()=>{accept.disabled=true;const body={token,decision:'accept',dateOfBirth:document.getElementById('dob').value,nationality:document.getElementById('nationality').value,occupation:document.getElementById('occupation').value,phone:document.getElementById('phone').value,residentialAddress:document.getElementById('residential').value,serviceAddress:document.getElementById('service').value};const r=await fetch('/api/cac/directors/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();status.innerHTML='<div class="status '+(r.ok?'':'error')+'">'+(j.message||j.error||'Unable to submit')+'</div>';if(r.ok)accept.textContent='Consent Recorded'};document.getElementById('upload').onclick=async()=>{const f=document.getElementById('doc').files[0],box=document.getElementById('uploadStatus');if(!f){box.innerHTML='<div class="status error">Choose a document first.</div>';return}const fd=new FormData();fd.append('token',token);fd.append('document',f);const r=await fetch('/api/cac/directors/document',{method:'POST',body:fd});const j=await r.json();box.innerHTML='<div class="status '+(r.ok?'':'error')+'">'+(r.ok?'Identity document submitted successfully.':j.error)+'</div>'}})();</script></body></html>
