<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submission Review — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:1100px;margin:auto;padding:36px 22px}.card{background:#0b1910;border:1px solid #203826;border-radius:16px;padding:18px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.muted{color:#9eb3a2}.pill{display:inline-block;background:#15301d;padding:5px 8px;border-radius:999px;font-size:12px}button{border:1px solid #29442f;background:#07130b;color:#eef6ee;border-radius:8px;padding:9px 12px;margin:5px;cursor:pointer}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Submission Review Queue</h1><p class="muted">Only accepted submissions can enter the canonical Asset Registry. Capture is never equivalent to verification.</p><div id="list">Loading…</div></main><script>const list=document.querySelector('#list');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){const r=await fetch('/api/submissions/queue');if(!r.ok){list.textContent='Review access required';return}const a=await r.json();list.innerHTML=a.map(x=>`<article class="card"><div class="muted">${esc(x.submissionIdentifier)}</div><h2>${esc(x.name)}</h2><div class="grid"><div>Type<br><b>${esc(x.assetTypeCode)}</b></div><div>Location<br><b>${esc(x.location||'—')}</b></div><div>Evidence<br><b>${x.evidenceCount}</b></div></div><p><span class="pill">${esc(x.status)}</span></p><button onclick="review('${x.id}','accept')">Accept</button><button onclick="review('${x.id}','request_info')">Request information</button><button onclick="review('${x.id}','reject')">Reject</button></article>`).join('')||'<p>No pending submissions.</p>'}async function review(id,decision){const notes=prompt('Review notes (optional)')||'';const r=await fetch('/api/submissions/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,notes})});if(!r.ok){alert('Review failed');return}if(decision==='accept'){const c=await fetch('/api/submissions/'+id+'/convert',{method:'POST'});if(!c.ok){alert('Accepted, but conversion failed.');return}}load()}load();</script></body></html>
