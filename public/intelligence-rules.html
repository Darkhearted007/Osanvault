<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence Rules</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:22px 30px}.wrap{max-width:900px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd4dd;border-radius:8px;margin:4px 0}button{background:#1769aa;color:#fff;cursor:pointer}.ok{color:#067647}.err{color:#b42318}pre{white-space:pre-wrap}</style></head><body><header class="head"><h1>Automated Intelligence Rules</h1><p>Create threshold rules that generate alerts.</p></header><main class="wrap"><section class="card"><div class="grid"><input id="org" placeholder="Organization UUID"><input id="dash" placeholder="Dashboard (operations, executive…)"><input id="name" placeholder="Rule name"><input id="metric" value="risk_score" placeholder="Metric"><select id="op"><option>&gt;=</option><option>&gt;</option><option>&lt;</option><option>=</option><option>!=</option></select><input id="threshold" type="number" placeholder="Threshold"><input id="module" value="alerts" placeholder="Alert module"><select id="severity"><option>HIGH</option><option>CRITICAL</option><option>MEDIUM</option><option>LOW</option></select></div><button onclick="createRule()">Create rule</button><pre id="out"></pre></section><section class="card"><h2>Evaluate a metric</h2><div class="grid"><input id="eorg" placeholder="Organization UUID"><input id="emetric" value="risk_score" placeholder="Metric name"><input id="value" type="number" placeholder="Observed value"><input id="source" placeholder="Source event ID (optional)"></div><button onclick="evaluateRule()">Evaluate</button></section></main><script>async function createRule(){const r=await fetch('/api/organizations/intelligence-rules',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({organization_id:org.value,dashboard:dash.value,name:name.value,metric:metric.value,operator:op.value,threshold:Number(threshold.value),module:module.value,severity:severity.value})});out.textContent=await r.text();out.className=r.ok?'ok':'err'}async function evaluateRule(){const r=await fetch('/api/organizations/intelligence-rule-evaluate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({organization_id:eorg.value,metric_name:emetric.value,metric:Number(value.value),source_event_id:source.value||null})});out.textContent=await r.text();out.className=r.ok?'ok':'err'}</script></body></html>
