<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Employee Self-Service</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202a}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin:14px 0}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.muted{color:#667085;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.box{background:#f8fafc;border-radius:12px;padding:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}h1{margin-bottom:6px}h2{margin-top:0}</style></head><body><div class='wrap'><div class='card hero'><div><div class='muted'>ÒSÁNVAULT AFRICA LTD</div><h1>Employee Self-Service</h1><div class='muted'>Your employment records, available securely to your account.</div></div><button onclick='load()'>Refresh</button></div><div id='app'><div class='card'>Loading your employee profile…</div></div></div><script>const API=window.__HATCHABLE__.api;const esc=s=>String(s??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const table=(headers,rows)=>!rows.length?'<p class="muted">No records yet.</p>':`<div style="overflow:auto"><table class="table"><thead><tr>${headers.map(esc).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;async function load(){const r=await fetch(API+'/employee/me');if(r.status===401){app.innerHTML='<div class="card"><h2>Sign in required</h2><p>Please sign in with your company employee account to access self-service.</p></div>';return}const d=await r.json();if(!r.ok){app.innerHTML=`<div class="card"><h2>Employee profile not linked</h2><p>${esc(d.error)}</p><p class="muted">Ask HR to link your account email to your employee record.</p></div>`;return}const p=d.profile;app.innerHTML=`<div class="card"><h2>${esc(p.full_name)}</h2><div class="grid"><div class="box"><b>Position</b><br>${esc(p.position)}</div><div class="box"><b>Department</b><br>${esc(p.department)}</div><div class="box"><b>Lifecycle</b><br><span class="pill">${esc(p.lifecycle_status)}</span></div><div class="box"><b>Email</b><br>${esc(p.email)}</div></div></div><div class="card"><h2>Contract</h2>${table(['Type','Start','End','Probation','Status'],d.contracts.map(x=>`<tr><td>${esc(x.contract_type)}</td><td>${esc(x.start_date)}</td><td>${esc(x.end_date)}</td><td>${esc(x.probation_end_date)}</td><td>${esc(x.status)}</td></tr>`))}</div><div class="card"><h2>Compensation</h2>${table(['Effective','Salary','Frequency','Allowances','Status'],d.compensation.map(x=>`<tr><td>${esc(x.effective_from)}</td><td>${esc(x.currency)} ${esc(x.salary_amount)}</td><td>${esc(x.pay_frequency)}</td><td>${esc(x.allowances)}</td><td>${esc(x.status)}</td></tr>`))}</div><div class="card"><h2>Leave</h2>${table(['Type','Start','End','Days','Status'],d.leave.map(x=>`<tr><td>${esc(x.leave_type)}</td><td>${esc(x.start_date)}</td><td>${esc(x.end_date)}</td><td>${esc(x.days)}</td><td>${esc(x.status)}</td></tr>`))}</div><div class="card"><h2>Training & Certifications</h2>${table(['Training','Provider','Completed','Expiry','Status'],d.training.map(x=>`<tr><td>${esc(x.training_name)}</td><td>${esc(x.provider)}</td><td>${esc(x.completed_date)}</td><td>${esc(x.expiry_date)}</td><td>${esc(x.status)}</td></tr>`))}</div><div class="card"><h2>Company Assets</h2>${table(['Asset','Tag','Issued','Returned','Status'],d.assets.map(x=>`<tr><td>${esc(x.asset_type)}</td><td>${esc(x.asset_tag)}</td><td>${esc(x.issued_date)}</td><td>${esc(x.returned_date)}</td><td>${esc(x.status)}</td></tr>`))}</div><div class="card"><h2>Performance Reviews</h2>${table(['Period','Reviewer','Rating','Status'],d.reviews.map(x=>`<tr><td>${esc(x.review_period)}</td><td>${esc(x.reviewer)}</td><td>${esc(x.rating)}</td><td>${esc(x.status)}</td></tr>`))}</div><div class="card"><h2>Emergency Contacts</h2>${table(['Name','Relationship','Phone','Email'],d.emergencyContacts.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.relationship)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td></tr>`))}</div>`}load();</script></body></html>
