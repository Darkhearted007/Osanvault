<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>People Intelligence</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202a;margin:0}.wrap{max-width:1200px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{font-size:27px;font-weight:800}.muted{color:#667085;font-size:13px}.pill{padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}</style></head><body><div class='wrap'><div class='card'><div class='muted'>ÒSÁNVAULT AFRICA LTD</div><h1>People Intelligence</h1><p class='muted'>Performance, attendance and leave signals for management decisions.</p></div><div id='cards' class='grid'></div><div class='card'><h2>Attendance — last 30 days</h2><div id='att'></div></div><div class='card'><h2>Performance pipeline</h2><div id='perf'></div></div></div><script>const API=window.__HATCHABLE__.api;async function load(){const x=await fetch(API+'/hr/performance-dashboard').then(r=>r.json());const total=a=>(a||[]).reduce((n,v)=>n+Number(v.count||0),0);cards.innerHTML=[['Employees',total(x.employees)],['Active goals',total((x.goals||[]).filter(v=>v.status==='active'))],['Reviews',total(x.reviews)],['Leave days available',Number(x.leave?.days_available||0).toFixed(1)]].map(v=>`<div class='card'><div class='muted'>${v[0]}</div><div class='metric'>${v[1]}</div></div>`).join('');att.innerHTML=(x.attendance||[]).length?(x.attendance.map(v=>`<span class='pill'>${v.status}: ${v.count}</span> `).join('')):'<span class="muted">No attendance records yet.</span>';perf.innerHTML=(x.goals||[]).length?(x.goals.map(v=>`<span class='pill'>Goals ${v.status}: ${v.count}</span> `).join(''))+' '+(x.reviews||[]).map(v=>`<span class='pill'>Reviews ${v.status}: ${v.count}</span>`).join(''):'<span class="muted">No performance records yet.</span>'}load().catch(()=>{});</script></body></html>
