<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Underwriting — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:900px;margin:auto;padding:40px 24px}.card{background:#0b1910;border:1px solid #203826;border-radius:18px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,textarea,button{width:100%;box-sizing:border-box;margin-top:7px;margin-bottom:12px;padding:11px;border-radius:10px;border:1px solid #29442f;background:#07130b;color:#eef6ee}.metric{font-size:28px;font-weight:700}.muted{color:#9eb3a2}.back{color:#a9c3ae;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/">← ÒsánVault</a><section class="card"><h1>Project Economics & Underwriting</h1><p class="muted">A decision-support layer. It does not constitute an investment recommendation or offer.</p><label>Project ID</label><input id="pid" placeholder="UUID"><button id="load">Load underwriting</button></section><div id="out"></div><script>const out=document.querySelector('#out');function esc(v){return String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}document.querySelector('#load').onclick=async()=>{const id=document.querySelector('#pid').value.trim();if(!id)return;try{const [u,e]=await Promise.all([fetch('/api/projects/'+id+'/underwriting').then(r=>r.json()),fetch('/api/projects/'+id+'/economics').then(r=>r.json())]);out.innerHTML=`<section class="card"><div class="metric">${esc(u?.overallScore??'—')} / 100</div><h2>${esc(u?.status||'Not assessed')}</h2><div class="grid"><div><b>Evidence</b><p>${esc(u?.evidenceScore??'—')}</p></div><div><b>Economic</b><p>${esc(u?.economicScore??'—')}</p></div></div><h3>Required actions</h3><ul>${(u?.requiredActions||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>None recorded</li>'}</ul><h3>Economics</h3><p>Projected revenue: ${esc(e?.model?.projectedRevenue||'—')} ${esc(e?.model?.currency||'')}</p></section>`}catch(x){out.textContent='Unable to load project underwriting.'}}</script></main></body></html>
