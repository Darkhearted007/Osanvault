<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorized Module</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:900px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:22px}.ok{color:#067647}.err{color:#b42318}pre{white-space:pre-wrap}</style></head><body><header class="head"><h1>Module Authorization</h1><p>Server-side organization, dashboard and module access check.</p></header><main class="wrap"><section class="card"><pre id="out">Checking authorization…</pre></section></main><script>const p=new URLSearchParams(location.search);const q=new URLSearchParams({organization_id:p.get('organization_id')||'',dashboard:p.get('dashboard')||'',module:p.get('module')||'',action:p.get('action')||'view'});fetch('/api/organizations/module-authorize?'+q).then(async r=>{const t=await r.text(),o=document.getElementById('out');o.className=r.ok?'ok':'err';o.textContent=t})</script></body></html>
