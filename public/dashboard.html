<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continental Intelligence Dashboard</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.top{background:#10243e;color:#fff;padding:24px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #dce3ed;border-radius:14px;padding:20px;box-shadow:0 4px 18px #10243e12}.kpi{font-size:32px;font-weight:800}.muted{color:#667085}.err{color:#b42318}</style></head><body><header class="top"><h1 id="title">Continental Intelligence</h1><p id="role">Authorized workspace</p></header><main class="wrap"><div id="content">Loading…</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/continental/gis-phase388-dashboard-launcher');const c=document.getElementById('content');if(!r.ok){c.innerHTML='<p class="err">'+esc((await r.json().catch(()=>({error:'Access denied'}))).error||'Access denied')+'</p>';return}const d=await r.json();document.getElementById('title').textContent=d.organization?.name||'Continental Intelligence';document.getElementById('role').textContent=d.position?.title||d.dashboard?.label||'Authorized workspace';c.innerHTML='<div class="grid">'+d.modules.map(m=>'<section class="card"><h2>'+esc(m.label)+'</h2><div class="kpi">'+esc(m.value)+'</div><p class="muted">'+esc(m.description)+'</p></section>').join('')+'</div>'}load()</script></body></html>
