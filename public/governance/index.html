<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Corporate Governance</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202a;margin:0}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:14px 0}h1{margin-bottom:6px}.muted{color:#667085}.rule{border-top:1px solid #eee;padding:12px 0}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:700}.content{white-space:pre-wrap;line-height:1.65}</style></head><body><main class='wrap'><section class='card'><div class='muted'>ÒSÁNVAULT AFRICA LTD</div><h1>Corporate Governance</h1><p class='muted'>Internal governance register, constitution and delegation-of-authority framework.</p></section><section id='constitution' class='card'>Loading constitution…</section><section class='card'><h2>Delegation of Authority</h2><div id='rules'>Loading…</div></section><section class='card'><h2>Governance Documents</h2><div id='docs'>Loading…</div></section></main><script>const API=window.__HATCHABLE__.api;async function load(){const r=await fetch(API+'/governance/register');if(!r.ok)throw Error('Access denied');const x=await r.json();const c=x.documents.find(d=>d.document_type==='company_constitution');document.getElementById('constitution').innerHTML=c?`<h2>${c.title}</h2><span class='badge'>${c.status} · v${c.version}</span><p class='muted'>Effective: ${c.effective_date||'Not yet adopted'}</p><div class='content'>${c.content.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`:'<h2>No constitution registered</h2>';document.getElementById('rules').innerHTML=x.authority_rules.length?x.authority_rules.map(v=>`<div class='rule'><b>${v.category}</b> — ${v.action}<br><span class='muted'>Approval: ${v.approval_level}${v.threshold_amount?' · '+v.currency+' '+v.threshold_amount:''}</span></div>`).join(''):'No authority rules yet.';document.getElementById('docs').innerHTML=x.documents.map(v=>`<div class='rule'><b>${v.title}</b> <span class='badge'>${v.document_type} · v${v.version} · ${v.status}</span></div>`).join('')}load().catch(()=>{document.getElementById('constitution').textContent='This governance register is restricted to authorized company administrators.'})</script></body></html>
