<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Company Governance</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202a;margin:0}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:14px 0}.muted{color:#667085;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}.content{white-space:pre-wrap;line-height:1.65}.warn{background:#fff8e6;border:1px solid #f0d98a;padding:14px;border-radius:12px}</style></head><body><div class='wrap'><div class='card'><div class='muted'>ÒSÁNVAULT AFRICA LTD</div><h1>Company Governance</h1><p>Central governance register for the company's constitution and future policies.</p></div><div id='app'><div class='card'>Loading…</div></div></div><script>const API=window.__HATCHABLE__.api;async function load(){const r=await fetch(API+'/governance/constitution');if(!r.ok){app.innerHTML='<div class="card"><h2>Governance access required</h2><p class="muted">Only authorized company administrators can view governance documents.</p></div>';return}const x=await r.json();if(!x.constitution){app.innerHTML='<div class="card"><h2>Constitution register</h2><div class="warn">No constitution has been entered yet. The system is ready to store the company governance constitution once the founders/advisers approve its wording.</div></div>';return}const c=x.constitution;app.innerHTML=`<div class='card'><h2>${c.title}</h2><span class='pill'>Version ${c.version}</span> <span class='pill'>${c.status}</span><p class='muted'>Effective: ${c.effective_date||'Not yet effective'} · Approved by: ${c.approved_by||'Pending'}</p></div><div class='card'><div class='content'>${c.content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div>`}load()</script></body></html>
