<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Payroll & Finance</title><style>body{font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#17202a;margin:0}.wrap{max-width:1250px;margin:28px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{font-size:30px;font-weight:800}.muted{color:#667085;font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f3;text-align:left;font-size:13px}.pill{padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}</style></head><body><div class='wrap'><div class='card'><div class='muted'>ÒSÁNVAULT AFRICA LTD</div><h1>Payroll & Finance</h1><p class='muted'>Restricted management surface for payroll periods, payroll runs and workforce compensation.</p></div><div id='metrics' class='grid'></div><div class='card'><h2>Payroll periods</h2><div style='overflow:auto'><table class='table'><thead><tr><th>Name</th><th>Period</th><th>Pay date</th><th>Status</th></tr></thead><tbody id='periods'></tbody></table></div></div><div class='card'><h2>Payroll runs</h2><div style='overflow:auto'><table class='table'><thead><tr><th>Period</th><th>Status</th><th>Gross</th><th>Deductions</th><th>Net</th></tr></thead><tbody id='runs'></tbody></table></div></div></div><script>const API=window.__HATCHABLE__.api;const money=n=>new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(Number(n||0));async function load(){const x=await fetch(API+'/payroll/dashboard').then(r=>r.json());const w=x.workforce||{};metrics.innerHTML=[['Active employees',w.employees],['Current base payroll',money(w.base_salary)],['Payroll periods',x.periods?.length||0],['Payroll runs',x.runs?.length||0]].map(a=>`<div class='card'><div class='muted'>${a[0]}</div><div class='metric'>${a[1]}</div></div>`).join('');periods.innerHTML=x.periods?.length?x.periods.map(p=>`<tr><td>${p.name}</td><td>${p.period_start} → ${p.period_end}</td><td>${p.pay_date||'—'}</td><td><span class='pill'>${p.status}</span></td></tr>`).join(''):'<tr><td colspan=4>No payroll periods created yet.</td></tr>';runs.innerHTML=x.runs?.length?x.runs.map(r=>`<tr><td>${r.name}</td><td><span class='pill'>${r.status}</span></td><td>${money(r.gross_total)}</td><td>${money(r.deductions_total)}</td><td>${money(r.net_total)}</td></tr>`).join(''):'<tr><td colspan=5>No payroll runs created yet.</td></tr>'}load().catch(()=>document.body.innerHTML+='<p style="padding:20px">Unable to load payroll dashboard.</p>');</script></body></html>
