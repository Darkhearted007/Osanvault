<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor Intelligence</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.head{background:#102a43;color:#fff;padding:24px 32px}.wrap{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:750}.muted{color:#667085}.notice{background:#eff8ff;border:1px solid #b2ddff;padding:15px;border-radius:12px;margin-bottom:18px}</style></head><body><header class="head"><h1 id="title">Investor Intelligence</h1><p id="sub">Loading authorized portfolio…</p></header><main class="wrap"><div id="notice"></div><div id="cards" class="grid"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('organization_id');if(!id)return;const r=await fetch('/api/organizations/investor-workspace?organization_id='+encodeURIComponent(id));if(!r.ok){document.getElementById('sub').textContent='Authorized investor workspace required.';return}const d=await r.json(),x=d.investor;document.getElementById('title').textContent=d.organization.name+' — Investor Intelligence';document.getElementById('sub').textContent=d.organization.organization_type+' · '+d.organization.role;document.getElementById('notice').innerHTML='<div class="notice"><strong>Portfolio data status:</strong> '+esc(x.readiness.reason)+'. The dashboard will populate automatically after authorized portfolio assets and evidence are assigned.</div>';const cards=[['Authorized portfolio assets',x.portfolio.totalAssets],['Asset readiness',x.readiness.available?'LIVE':'PENDING'],['Risk intelligence',x.risk.available?'LIVE':'PENDING'],['Evidence confidence',x.evidenceConfidence.available?'LIVE':'PENDING'],['Opportunities',x.opportunities.available?'LIVE':'PENDING']];document.getElementById('cards').innerHTML=cards.map(c=>`<section class="card"><div class="muted">${esc(c[0])}</div><div class="num">${esc(c[1])}</div></section>`).join('')}load()</script></body></html>
