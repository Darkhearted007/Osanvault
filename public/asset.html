<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Passport — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:1160px;margin:auto;padding:28px 20px}.back{color:#b7c8ba;text-decoration:none}.hero,.section{background:#0b1910;border:1px solid #203826;border-radius:18px;padding:20px;margin-top:16px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{padding:14px;background:#09160d;border-radius:12px}.label{font-size:11px;color:#8db297;text-transform:uppercase;letter-spacing:.08em}.value{margin-top:5px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#15301d}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button,input,select,textarea{background:#08150c;color:#eef6ee;border:1px solid #29442f;border-radius:9px;padding:10px}textarea{min-height:70px;width:100%;box-sizing:border-box}button{cursor:pointer}.list{display:grid;gap:9px}.row{padding:13px;border:1px solid #1c3323;border-radius:10px}.muted{color:#9db3a1;font-size:14px}.danger{color:#e8b0a8}@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/assets.html">← Asset Registry</a><div id="app">Loading Asset Passport…</div></main><script>const id=new URLSearchParams(location.search).get('id'),app=document.querySelector('#app');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function list(title,items,mapper){return `<section class="section"><h2>${title}</h2><div class="list">${items.length?items.map(mapper).join(''):'<div class="muted">No records yet.</div>'}</div></section>`}async function load(){if(!id)return app.innerHTML='<section class="section danger">Missing asset id.</section>';try{const r=await fetch('/api/assets/'+encodeURIComponent(id));if(!r.ok)throw new Error('Asset not found');const a=await r.json();app.innerHTML=`<section class="hero"><div><div class="label">${esc(a.assetIdentifier)}</div><h1>${esc(a.name)}</h1><p class="muted">${esc(a.description||'No description yet.')}</p></div><div><div class="label">Registry status</div><h2><span class="pill">${esc(a.status)}</span></h2><div class="muted">${esc(a.assetTypeName)} · ${esc(a.jurisdiction||'Jurisdiction pending')}</div></div></section><section class="section"><div class="grid"><div class="item"><div class="label">Asset class</div><div class="value">${esc(a.assetClass)}</div></div><div class="item"><div class="label">Location</div><div class="value">${esc(a.location||'Not recorded')}</div></div><div class="item"><div class="label">Current state</div><div class="value">${esc(a.currentState||'Not recorded')}</div></div></div></section>`+list('Evidence Vault',a.evidence,x=>`<div class="row"><b>${esc(x.evidenceType)}</b><div class="muted">${esc(x.description)}</div><small>${esc(x.source||'')} · confidence ${esc(x.confidence??'unrated')} · ${esc(x.status)}</small></div>`)+list('Documents',a.documents,x=>`<div class="row"><b>${esc(x.title)}</b><div class="muted">${esc(x.documentType)} · SHA-256 ${esc(x.documentHash||'not recorded')}</div><small>${esc(x.status)} · version ${esc(x.version)}</small></div>`)+list('Verification',a.verification,x=>`<div class="row"><b>${esc(x.verificationLevel)}</b><div class="muted">${esc(x.status)} · opened ${esc(x.openedAt)}</div></div>`)+list('Projects',a.projects,x=>`<div class="row"><b>${esc(x.name)}</b><div class="muted">${esc(x.projectType)} · ${esc(x.status)}</div></div>`)+list('Valuation',a.valuations,x=>`<div class="row"><b>${esc(x.currency)} ${esc(x.value??'Not valued')}</b><div class="muted">${esc(x.methodology||'Methodology pending')} · confidence ${esc(x.confidence??'unrated')}</div></div>`)+list('Risk',a.risks,x=>`<div class="row"><b>${esc(x.riskLevel)} · score ${esc(x.overallScore??'unassessed')}</b><div class="muted">Model ${esc(x.model)}</div></div>`);await loadOps()}catch(e){app.innerHTML='<section class="section danger">'+esc(e.message)+'</section>'}}async function loadOps(){const [v,e]=await Promise.all([fetch('/api/assets/'+id+'/verification'),fetch('/api/assets/'+id+'/events')]);if(!v.ok||!e.ok)return;const vd=await v.json(),ev=await e.json();app.insertAdjacentHTML('beforeend',`<section class="section"><h2>Verification Workspace</h2><div class="grid"><div class="item"><div class="label">Case</div><div class="value">${esc(vd.case.status)}</div></div><div class="item"><div class="label">Level</div><div class="value">${esc(vd.case.verificationLevel)}</div></div><div class="item"><div class="label">Requirements</div><div class="value">${vd.requirements.length}</div></div></div><div class="toolbar"><button onclick="review('approved')">Approve</button><button onclick="review('rejected')">Reject</button><button onclick="review('pending')">Keep Pending</button></div></section>`);app.insertAdjacentHTML('beforeend',list('Audit Timeline',ev,x=>`<div class="row"><b>${esc(x.eventType)}</b><div class="muted">${esc(x.actor||'system')} · ${esc(x.createdAt)}</div></div>`))}async function review(decision){const rationale=prompt('Rationale for '+decision+'?')||'';const r=await fetch('/api/assets/'+id+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,rationale,actionType:'review'})});if(!r.ok){alert('Review failed');return}load()}load();</script></body></html>
