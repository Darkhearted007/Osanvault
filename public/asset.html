<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Passport — ÒsánVault</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#06110a;color:#eef6ee}main{max-width:1100px;margin:auto;padding:32px 24px}.back{color:#b7c8ba;text-decoration:none}.hero,.section{background:#0b1910;border:1px solid #203826;border-radius:18px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.item{padding:14px;background:#09160d;border-radius:12px}.label{font-size:12px;color:#8db297}.value{margin-top:5px;font-size:16px}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#15301d;margin-top:8px}.list{display:grid;gap:10px}.muted{color:#9db3a1}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="/assets.html">← Asset Registry</a><div id="app" class="hero">Loading Asset Passport…</div></main><script>const id=new URLSearchParams(location.search).get('id');const app=document.querySelector('#app');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function section(title,items){return `<div class="section"><h2>${title}</h2><div class="list">${items.length?items.map(x=>`<div class="item"><b>${esc(x.title||x.evidenceType||x.documentType||x.projectIdentifier||x.riskLevel||'Record')}</b><div class="muted">${esc(x.description||x.status||x.rationale||x.methodology||'')}</div></div>`).join(''):'<div class="muted">No records yet.</div>'}</div>`}async function load(){if(!id){app.textContent='Missing asset id';return}try{const r=await fetch('/api/assets/'+encodeURIComponent(id));if(!r.ok)throw new Error('Asset not found');const a=await r.json();app.innerHTML=`<div><div class="label">${esc(a.assetIdentifier)}</div><h1>${esc(a.name)}</h1><p>${esc(a.description||'No description yet.')}</p><span class="pill">${esc(a.status)}</span></div><div class="grid"><div class="item"><div class="label">Asset type</div><div class="value">${esc(a.assetTypeName)}</div></div><div class="item"><div class="label">Jurisdiction</div><div class="value">${esc(a.jurisdiction||'Not recorded')}</div></div><div class="item"><div class="label">Location</div><div class="value">${esc(a.location||'Not recorded')}</div></div><div class="item"><div class="label">Coordinates</div><div class="value">${a.latitude??'—'}, ${a.longitude??'—'}</div></div></div>`+section('Evidence',a.evidence)+section('Verification',a.verification)+section('Projects',a.projects)+section('Valuation',a.valuations)+section('Risk',a.risks)}catch(e){app.textContent=e.message}}load();</script></body></html>
